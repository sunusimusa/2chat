name: Build 2Chat Release AAB

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 2Chat
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Diagnose KEYSTORE_BASE64
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 is empty"
            exit 1
          fi

          LENGTH=${#KEYSTORE_BASE64}
          echo "KEYSTORE_BASE64 length: $LENGTH"

          if ! printf '%s' "$KEYSTORE_BASE64" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
            echo "KEYSTORE_BASE64 contains invalid Base64 characters"
            exit 1
          fi

          if [ $((LENGTH % 4)) -ne 0 ]; then
            echo "KEYSTORE_BASE64 length is not divisible by 4"
            exit 1
          fi

          echo "Base64 character and length checks passed"

      - name: Test decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > /tmp/2chat-upload-key.jks

          if [ ! -s /tmp/2chat-upload-key.jks ]; then
            echo "Decoded keystore is empty"
            exit 1
          fi

          echo "Base64 decode succeeded"
          echo "Decoded keystore size: $(wc -c < /tmp/2chat-upload-key.jks) bytes"

      - name: Verify keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "KEYSTORE_PASSWORD is empty"
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "KEY_ALIAS is empty"
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "KEY_PASSWORD is empty"
            exit 1
          fi

          keytool -list \
            -keystore /tmp/2chat-upload-key.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Keystore and alias verification succeeded"

      - name: Restore signing keystore
        run: |
          cp /tmp/2chat-upload-key.jks android/2chat-upload-key.jks
          chmod 600 android/2chat-upload-key.jks
          echo "Keystore restored successfully"

      - name: Build Signed Release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle bundleRelease --no-daemon

      - name: Upload Signed Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: 2Chat-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
