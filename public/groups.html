<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>2Chat Groups</title>

<link
    rel="stylesheet"
    href="/css/groups.css"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
>

</head>


<body>


<!-- ==========================
HEADER
========================== -->

<header class="groups-header">

    <button
        type="button"
        onclick="history.back()"
    >

        <i class="fa-solid fa-arrow-left"></i>

    </button>


    <h2>
        Groups
    </h2>


    <button
        type="button"
        onclick="location.href='/create-group.html'"
    >

        <i class="fa-solid fa-plus"></i>

    </button>

</header>



<!-- ==========================
SEARCH
========================== -->

<div class="search-box">

    <i class="fa-solid fa-magnifying-glass"></i>

    <input
        type="text"
        id="searchGroup"
        placeholder="Search groups..."
    >

</div>



<!-- ==========================
MY GROUPS
========================== -->

<div class="section-title">

    My Groups

</div>


<div id="myGroups">

</div>



<!-- ==================================================
GROUP INVITATION NOTIFICATION

IMPORTANT:

card ɗin nan da kansa idan akwai
pending invitation.

KADA A SAKE SAKA CARD ƊIN NAN A HTML.
================================================== -->



<!-- ==========================
ADMIN MANAGEMENT
========================== -->

<div
    id="adminManagementSection"
    class="admin-management-section"
    style="display:none;"
>

    <div class="section-title">

        Admin Management

    </div>


    <div class="admin-management-card">

        <div class="admin-management-icon">

            <i class="fa-solid fa-user-shield"></i>

        </div>


        <div class="admin-management-info">

            <h3>
                Manage Group Admins
            </h3>


            <p>
                Add or remove admins from your group.
            </p>

        </div>


        <button
            id="openAdminManagement"
            class="admin-management-btn"
            type="button"
        >

            <i class="fa-solid fa-gear"></i>

            Manage

        </button>

    </div>

</div>



<!-- ==========================
DISCOVER GROUPS
========================== -->

<div class="section-title">

    Discover Groups

</div>


<div id="groupsList">

</div>



<!-- ==========================
JAVASCRIPT
========================== -->

<script
    src="/js/groups.js"
></script>


</body>

</html>
