<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Group</title>

<link rel="stylesheet" href="/css/create-group.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

</head>

<body>

<!-- Header -->

<header class="header">

<button class="back-btn" onclick="history.back()">

<i class="fa-solid fa-arrow-left"></i>

</button>

<h2>Create New Group</h2>

</header>

<!-- Container -->

<div class="container">

<!-- Avatar -->

<div class="avatar-box">

<label for="groupImage">

<img
id="previewImage"
src="/images/default-group.png"
class="group-avatar">

<div class="camera-icon">

<i class="fa-solid fa-camera"></i>

</div>

</label>

<input
type="file"
id="groupImage"
accept="image/*"
hidden>

</div>

<!-- Group Name -->

<div class="input-box">

<i class="fa-solid fa-users"></i>

<input
type="text"
id="groupName"
placeholder="Enter group name">

</div>

<!-- Description -->

<div class="input-box textarea-box">

<i class="fa-solid fa-align-left"></i>

<textarea
id="groupDescription"
placeholder="Group description (optional)"></textarea>

</div>

<!-- Create -->

<button
id="createBtn"
class="create-btn"
onclick="createGroup()">

<i class="fa-solid fa-users"></i>

<span>Create Group</span>

</button>

</div>

<script src="/js/create-group.js"></script>

</body>

</html>
