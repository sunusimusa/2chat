<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Group</title>

<link rel="stylesheet" href="/css/create-group.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

</head>

<body>

<header class="header">

<button onclick="history.back()">

<i class="fa-solid fa-arrow-left"></i>

</button>

<h2>Create Group</h2>

</header>

<div class="container">

<label for="groupImage">

<img
id="previewImage"
src="/images/default-group.png"
class="group-avatar">

</label>

<input
type="file"
id="groupImage"
accept="image/*"
hidden>

<input
type="text"
id="groupName"
placeholder="Group Name">

<textarea
id="groupDescription"
placeholder="Group Description"></textarea>

<button
id="createBtn"
onclick="createGroup()">

<i class="fa-solid fa-users"></i>

Create Group

</button>

</div>

<script src="/js/create-group.js"></script>

</body>

</html>
