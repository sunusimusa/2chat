<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>2Chat Home</title>

<link
rel="stylesheet"
href="/css/home.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

</head>

<body>

<!-- =====================================================
     TOP HEADER
===================================================== -->

<header class="app-header">

<div class="header-logo">
    2Chat
</div>

<div class="header-actions">

<button
id="createHeaderBtn"
onclick="focusCreatePost()"
aria-label="Create">

<i class="fa-solid fa-plus"></i>

</button>

<button
id="searchBtn"
onclick="openSearch()"
aria-label="Search">

<i class="fa-solid fa-magnifying-glass"></i>

</button>

<button
id="menuBtn"
onclick="openMenu()"
aria-label="Menu">

<i class="fa-solid fa-bars"></i>

</button>

</div>

</header>


<!-- =====================================================
     QUICK NAVIGATION
===================================================== -->

<nav class="quick-nav">

<a
href="/home.html"
class="quick-item active">

<i class="fa-solid fa-house"></i>

</a>

<a
href="/users.html"
class="quick-item">

<i class="fa-solid fa-user-group"></i>

</a>

<a
href="/messenger.html"
class="quick-item">

<i class="fa-solid fa-comments"></i>

</a>

<a
href="/groups.html"
class="quick-item">

<i class="fa-solid fa-users"></i>

</a>

<a
href="/notification.html"
class="quick-item notification-item">

<i class="fa-solid fa-bell"></i>

<span
id="notificationCount">
</span>

</a>

</nav>


<!-- =====================================================
     SEARCH BOX
===================================================== -->

<div
id="searchPanel"
class="search-panel">

<div class="search-inner">

<button
onclick="closeSearch()">

<i class="fa-solid fa-arrow-left"></i>

</button>

<input
id="searchInput"
type="search"
placeholder="Search 2Chat...">

<button
onclick="performSearch()">

<i class="fa-solid fa-magnifying-glass"></i>

</button>

</div>

</div>


<!-- =====================================================
     SIDE MENU OVERLAY
===================================================== -->

<div
id="menuOverlay"
class="menu-overlay"
onclick="closeMenu()">
</div>


<!-- =====================================================
     SIDE MENU
===================================================== -->

<div
id="sideMenu"
class="side-menu">

<div class="menu-header">

<div>

<strong>2Chat</strong>

<small>Community</small>

</div>

<button
onclick="closeMenu()">

<i class="fa-solid fa-xmark"></i>

</button>

</div>


<div class="menu-user">

<div class="menu-avatar">

<i class="fa-solid fa-user"></i>

</div>

<div>

<b id="userName"></b>

<small>View your profile</small>

</div>

</div>


<a href="/home.html">

<i class="fa-solid fa-house"></i>

<span>Home</span>

</a>


<a href="/messenger.html">

<i class="fa-solid fa-comments"></i>

<span>Chats</span>

</a>


<a href="/groups.html">

<i class="fa-solid fa-users"></i>

<span>Groups</span>

</a>


<a href="/users.html">

<i class="fa-solid fa-user-group"></i>

<span>Friends</span>

</a>


<a href="/shorts.html">

<i class="fa-solid fa-clapperboard"></i>

<span>Shorts</span>

</a>


<a href="/trending.html">

<i class="fa-solid fa-fire"></i>

<span>Trending</span>

</a>


<a href="/notification.html">

<i class="fa-solid fa-bell"></i>

<span>Notifications</span>

<span
class="menu-notification"
id="menuNotificationCount">
</span>

</a>


<a href="/profile.html">

<i class="fa-solid fa-user"></i>

<span>Profile</span>

</a>


<a
href="#"
onclick="logout(); return false;">

<i class="fa-solid fa-right-from-bracket"></i>

<span>Logout</span>

</a>

</div>


<!-- =====================================================
     CREATE POST
===================================================== -->

     <section
class="create-post"
id="createPostSection">

    <div class="create-user-row">

        <div class="create-avatar">
            <img
                id="createPostAvatar"
                src="/images/default.png"
                alt="Profile">
        </div>

        <textarea
            id="postText"
            placeholder="What's happening?">
        </textarea>

    </div>

     </section>

    <!-- PHOTO -->
    <input
    type="file"
    id="postImage"
    accept="image/*"
    hidden>

    <!-- VIDEO -->
    <input
    type="file"
    id="postVideo"
    accept="video/*"
    hidden>

    <!-- PREVIEW -->
    <div
id="postPreview"
class="post-preview"
style="display:none;">

    <img
    id="postPreviewImage"
    style="display:none;">

    <video
    id="postPreviewVideo"
    controls
    playsinline
    style="display:none;">
    </video>

    <button
    type="button"
    onclick="removePostMedia()">

        <i class="fa-solid fa-trash"></i>
        Remove

    </button>

</div>
    
    <!-- ACTIONS -->
    <div class="post-actions">

        <label
        for="postImage"
        class="image-btn">

            <i class="fa-solid fa-image"></i>
            Photo

        </label>

        <label
        for="postVideo"
        class="video-btn">

            <i class="fa-solid fa-video"></i>
            Video

        </label>

        <button
        id="postBtn"
        type="button"
        onclick="createPost()">

            <i class="fa-solid fa-paper-plane"></i>
            Post

        </button>

    </div>

</section>

<!-- =====================================================
     STATUS / ONLINE USERS
===================================================== -->

<div
id="friendsStatus"
class="friends-status">

</div>


<!-- =====================================================
     FEED
===================================================== -->

<main id="feed">

<div class="loading">

<i class="fa-solid fa-spinner fa-spin"></i>

Loading posts...

</div>

</main>


<!-- =====================================================
     BOTTOM NAVIGATION
===================================================== -->

<nav class="bottom-nav">

<a
href="/home.html"
class="active">

<i class="fa-solid fa-house"></i>

<span>Home</span>

</a>


<a
href="/shorts.html">

<i class="fa-solid fa-clapperboard"></i>

<span>Shorts</span>

</a>


<a
href="/trending.html">

<i class="fa-solid fa-fire"></i>

<span>Trending</span>

</a>


<a
href="/messenger.html">

<i class="fa-solid fa-comments"></i>

<span>Chats</span>

</a>


<a
href="/profile.html">

<i class="fa-solid fa-user"></i>

<span>Profile</span>

</a>

</nav>


<script
src="/js/home.js">
</script>

</body>

  </html>
