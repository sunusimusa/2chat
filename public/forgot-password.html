<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password | 2Chat</title>
<style>body{font-family:Arial,sans-serif;background:#f3f6fb;margin:0;padding:20px;color:#172033}.card{max-width:440px;margin:35px auto;background:#fff;padding:22px;border-radius:14px;box-shadow:0 5px 24px #0001}input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border:1px solid #ccd4e0;border-radius:8px;font-size:15px}button{background:#087cf0;color:white;border:0;font-weight:bold}#msg{line-height:1.5}a{color:#087cf0}</style></head><body>
<main class="card"><h2>Reset your 2Chat password</h2><p>Enter your username or email and your Recovery Key or one unused Backup Code.</p>
<form id="form"><label>Username or email</label><input id="identifier" autocomplete="username" required>
<label>Recovery Key or Backup Code</label><input id="recoveryCode" autocomplete="off" autocapitalize="characters" required>
<label>New password (8-128 characters)</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
<label>Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
<button id="submitBtn" type="submit">Reset Password</button></form><p id="msg" role="status"></p><p><a href="/login.html">Back to Login</a></p></main>
<script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg'),btn=document.getElementById('submitBtn'),pw=document.getElementById('newPassword').value;if(pw!==document.getElementById('confirmPassword').value){msg.textContent='The passwords do not match.';return;}btn.disabled=true;msg.textContent='Checking recovery code...';try{const res=await fetch('/api/auth/recovery/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:document.getElementById('identifier').value,recoveryCode:document.getElementById('recoveryCode').value,newPassword:pw})});const data=await res.json();msg.textContent=data.message|| (res.ok?'Password reset.':'Unable to reset password.');if(res.ok&&data.success){document.getElementById('form').reset();setTimeout(()=>location.href='/login.html',1800);}}catch(err){msg.textContent='Network error. Please try again.';}finally{btn.disabled=false;}});</script></body></html>
