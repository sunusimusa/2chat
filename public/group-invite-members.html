<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Invite Members</title>

    <link
        rel="stylesheet"
        href="/css/group-invite-members.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    >

</head>

<body>

<header class="invite-header">

    <button
        id="backButton"
        type="button"
        aria-label="Go back"
    >

        <i class="fa-solid fa-arrow-left"></i>

    </button>

    <h2>
        Invite Members
    </h2>

</header>


<main class="invite-container">

    <!-- INTRO -->

    <section class="invite-intro">

        <div class="invite-icon">

            <i class="fa-solid fa-user-plus"></i>

        </div>

        <h3>
            Invite People
        </h3>

        <p>
            Search for 2Chat users and invite them
            to join this group.
        </p>

    </section>


    <!-- SEARCH -->

    <section class="search-section">

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="Search username..."
                autocomplete="off"
            >

        </div>

    </section>


    <!-- MESSAGE -->

    <div
        id="inviteMessage"
        class="invite-message"
    ></div>


    <!-- LOADING -->

    <div
        id="loading"
        class="loading"
    >

        <i class="fa-solid fa-spinner fa-spin"></i>

        Loading users...

    </div>


    <!-- USERS -->

    <section
        id="usersList"
        class="users-list"
    ></section>


    <!-- INFO -->

    <section class="invite-info-box">

        <i class="fa-solid fa-circle-info"></i>

        <div>

            <strong>
                How invitations work
            </strong>

            <p>
                When you invite someone, they will
                receive the invitation in their
                Group Invitations page.
            </p>

        </div>

    </section>

</main>


<script
    src="/js/group-invite-members.js"
></script>

</body>

</html>
