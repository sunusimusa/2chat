<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Group Settings</title>

<link
    rel="stylesheet"
    href="/css/group-settings.css"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
>

</head>

<body>


<!-- ==========================
     HEADER
========================== -->

<header class="settings-header">

    <button
        id="backButton"
        type="button"
    >

        <i class="fa-solid fa-arrow-left"></i>

    </button>

    <h2>

        Group Settings

    </h2>

</header>


<!-- ==========================
     GROUP PREVIEW
========================== -->

<section class="group-preview">

    <div class="cover-wrapper">

        <img
            id="groupCover"
            src="/images/default-group-cover.jpg"
            alt="Group Cover"
        >

        <button
            id="changeCoverBtn"
            type="button"
            class="change-cover-btn"
        >

            <i class="fa-solid fa-camera"></i>

        </button>

        <input
            type="file"
            id="coverInput"
            accept="image/*"
            hidden
        >

    </div>


    <div class="avatar-wrapper">

        <img
            id="groupAvatar"
            src="/images/default-group.png"
            alt="Group Avatar"
        >

        <button
            id="changeAvatarBtn"
            type="button"
            class="change-avatar-btn"
        >

            <i class="fa-solid fa-camera"></i>

        </button>

        <input
            type="file"
            id="avatarInput"
            accept="image/*"
            hidden
        >

    </div>


    <h2 id="previewGroupName">

        Loading...

    </h2>

</section>


<!-- ==========================
     SETTINGS FORM
========================== -->

<main class="settings-container">


    <!-- GROUP NAME -->

    <div class="setting-section">

        <label for="groupName">

            <i class="fa-solid fa-users"></i>

            Group Name

        </label>

        <input
            type="text"
            id="groupName"
            placeholder="Enter group name"
            maxlength="100"
        >

    </div>


    <!-- DESCRIPTION -->

    <div class="setting-section">

        <label for="groupDescription">

            <i class="fa-solid fa-align-left"></i>

            Description

        </label>

        <textarea
            id="groupDescription"
            placeholder="Enter group description"
            maxlength="500"
            rows="4"
        ></textarea>

    </div>


    <!-- PRIVACY -->

    <div class="setting-section">

        <label>

            <i class="fa-solid fa-lock"></i>

            Group Privacy

        </label>


        <div class="privacy-options">


            <label class="privacy-option">

                <input
                    type="radio"
                    name="groupPrivacy"
                    value="public"
                    id="publicGroup"
                    checked
                >

                <span>

                    <i class="fa-solid fa-globe"></i>

                    <strong>
                        Public
                    </strong>

                    <small>
                        Anyone can find and join this group.
                    </small>

                </span>

            </label>


            <label class="privacy-option">

                <input
                    type="radio"
                    name="groupPrivacy"
                    value="private"
                    id="privateGroup"
                >

                <span>

                    <i class="fa-solid fa-lock"></i>

                    <strong>
                        Private
                    </strong>

                    <small>
                        Only invited members can join this group.
                    </small>

                </span>

            </label>


        </div>

    </div>


    <!-- SAVE -->

    <button
        id="saveSettingsBtn"
        type="button"
        class="save-settings-btn"
    >

        <i class="fa-solid fa-floppy-disk"></i>

        Save Changes

    </button>


    <!-- MESSAGE -->

    <div
        id="settingsMessage"
        class="settings-message"
    ></div>

    <!-- ==========================
     INVITE MEMBERS
========================== -->

<section class="invite-section">

    <h3>
        <i class="fa-solid fa-user-plus"></i>
        Invite Members
    </h3>

    <p>
        Invite other 2Chat users to join this group.
    </p>

    <button
        id="inviteMembersBtn"
        type="button"
        class="invite-members-btn"
    >

        <i class="fa-solid fa-user-plus"></i>

        Invite Members

    </button>

</section>


    <!-- DANGER ZONE -->

    <section class="danger-zone">

        <h3>

            <i class="fa-solid fa-triangle-exclamation"></i>

            Danger Zone

        </h3>

        <p>

            These actions can affect the whole group.

        </p>


        <button
            id="leaveGroupBtn"
            type="button"
            class="leave-btn"
        >

            <i class="fa-solid fa-right-from-bracket"></i>

            Leave Group

        </button>


        <button
            id="deleteGroupBtn"
            type="button"
            class="delete-btn"
        >

            <i class="fa-solid fa-trash"></i>

            Delete Group

        </button>

    </section>


</main>


<!-- ==========================
     JAVASCRIPT
========================== -->

<script src="/js/group-settings.js"></script>

</body>

</html>
