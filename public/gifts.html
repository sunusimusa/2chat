<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>2Chat Send Gift</title>

    <link
        rel="stylesheet"
        href="/css/gifts.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

</head>


<body>


<header class="gifts-header">

    <button
        class="back-btn"
        onclick="history.back()">

        <i class="fa-solid fa-arrow-left"></i>

    </button>


    <h1>
        🎁 Send Gift
    </h1>

</header>



<main class="gifts-container">


    <!-- =========================
         CREATOR
    ========================== -->

    <section class="creator-card">

        <img
            id="receiverAvatar"
            class="receiver-avatar"
            src="/images/default.png"
            alt="Creator">

        <div class="creator-info">

            <span>
                Sending gift to
            </span>

            <strong id="receiverName">
                @Creator
            </strong>

        </div>

    </section>



    <!-- =========================
         COINS
    ========================== -->

    <section class="coin-card">

        <div>

            <span>
                🪙 Your Coins
            </span>

            <small>
                Available balance
            </small>

        </div>


        <strong id="myCoins">
            0
        </strong>

    </section>



    <!-- =========================
         GIFT TITLE
    ========================== -->

    <div class="gift-title">

        <h2>
            Choose a Gift
        </h2>

        <p>
            Send a gift to support this creator.
        </p>

    </div>



    <!-- =========================
         GIFTS GRID
    ========================== -->

    <section
        id="giftGrid"
        class="gift-grid">

    </section>



    <!-- =========================
         SELECTED GIFT
    ========================== -->

    <section
        id="selectedBox"
        class="selected-box"
        style="display:none;">

        <div
            id="selectedIcon"
            class="selected-icon">

            🎁

        </div>


        <div class="selected-info">

            <span>
                Selected Gift
            </span>

            <strong id="selectedName">
                Gift
            </strong>

        </div>


        <div class="selected-price">

            <strong id="selectedCoins">
                0
            </strong>

            <span>
                coins
            </span>

        </div>

    </section>



    <!-- =========================
         SEND BUTTON
    ========================== -->

    <button
    id="sendBtn"
    class="send-gift-btn"
    onclick="sendSelectedGift()">

    🎁 Send Gift

</button>


    <!-- =========================
         FOOTER MESSAGE
    ========================== -->

    <div
        id="giftMessage"
        class="gift-message">

    </div>


</main>



<script src="/js/gifts.js"></script>


</body>

</html>
