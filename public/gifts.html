<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Send Gift</title>

    <link
        rel="stylesheet"
        href="/css/gifts.css">

</head>


<body>

    <header class="gifts-header">

        <button
            class="back-btn"
            onclick="history.back()">

            ←

        </button>

        <h1>
            🎁 Send a Gift
        </h1>

    </header>


    <main class="gifts-container">


        <!-- CREATOR -->

        <section class="creator-card">

            <div class="creator-icon">
                👤
            </div>

            <div>

                <span>
                    Sending gift to
                </span>

                <strong id="creatorName">
                    Creator
                </strong>

            </div>

        </section>


        <!-- COINS -->

        <section class="coin-card">

            <span>
                🪙 Your Coins
            </span>

            <strong id="coinBalance">
                0
            </strong>

        </section>


        <!-- GIFT OPTIONS -->

        <h2>
            Choose a Gift
        </h2>

        <section
            id="giftOptions"
            class="gift-options">


            <button
                class="gift-option"
                data-gift="rose"
                data-coins="10">

                <span class="gift-emoji">
                    🌹
                </span>

                <strong>
                    Rose
                </strong>

                <small>
                    10 coins
                </small>

            </button>


            <button
                class="gift-option"
                data-gift="gift-box"
                data-coins="50">

                <span class="gift-emoji">
                    🎁
                </span>

                <strong>
                    Gift Box
                </strong>

                <small>
                    50 coins
                </small>

            </button>


            <button
                class="gift-option"
                data-gift="diamond"
                data-coins="100">

                <span class="gift-emoji">
                    💎
                </span>

                <strong>
                    Diamond
                </strong>

                <small>
                    100 coins
                </small>

            </button>


            <button
                class="gift-option"
                data-gift="heart"
                data-coins="150">

                <span class="gift-emoji">
                    💖
                </span>

                <strong>
                    Heart
                </strong>

                <small>
                    150 coins
                </small>

            </button>


            <button
                class="gift-option"
                data-gift="crown"
                data-coins="500">

                <span class="gift-emoji">
                    👑
                </span>

                <strong>
                    Crown
                </strong>

                <small>
                    500 coins
                </small>

            </button>


            <button
                class="gift-option"
                data-gift="rocket"
                data-coins="1000">

                <span class="gift-emoji">
                    🚀
                </span>

                <strong>
                    Rocket
                </strong>

                <small>
                    1,000 coins
                </small>

            </button>

        </section>


        <!-- SELECTED -->

        <div
            id="selectedGift"
            class="selected-gift">

            Choose a gift first.

        </div>


        <!-- MESSAGE -->

        <div
            id="giftMessage"
            class="gift-message">
        </div>


        <!-- SEND -->

        <button
            id="sendGiftBtn"
            class="send-gift-btn"
            disabled>

            🎁 Send Gift

        </button>


    </main>


    <script src="/js/gifts.js"></script>

</body>

</html>
