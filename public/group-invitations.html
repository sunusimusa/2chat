<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Group Invitations</title>


    <!-- ==========================
         CSS
    =========================== -->

    <link
        rel="stylesheet"
        href="/css/group-invitations.css"
    >


    <!-- ==========================
         FONT AWESOME
    =========================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    >

</head>


<body>


    <!-- ==========================
         HEADER
    =========================== -->

    <header class="invitations-header">

        <button
            id="backButton"
            type="button"
            aria-label="Go back"
        >

            <i class="fa-solid fa-arrow-left"></i>

        </button>


        <h2>
            Group Invitations
        </h2>

    </header>



    <!-- ==========================
         MAIN
    =========================== -->

    <main class="invitations-container">


        <!-- ==========================
             INVITATIONS CONTAINER

             IMPORTANT:
             JS zai sarrafa komai a nan.
        =========================== -->

        <div
            id="invitationsContainer"
            class="invitations-list"
        >

            <!--
                Loading / Empty / Invitations
                za su bayyana a nan ta JavaScript.
            -->

            <div class="loading">

                <i class="fa-solid fa-spinner fa-spin"></i>

                Loading invitations...

            </div>

        </div>


    </main>



    <!-- ==========================
         JAVASCRIPT
    =========================== -->

    <script
        src="/js/group-invitations.js"
    ></script>


</body>

</html>
