<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101827">

    <title>2Chat | Blocked Users</title>

    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <style>
        .blocked-page {
            max-width: 650px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 40px;
        }

        .blocked-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .blocked-header a {
            color: inherit;
            font-size: 20px;
            text-decoration: none;
        }

        .blocked-user {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            margin-bottom: 12px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .blocked-user img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
        }

        .blocked-info {
            flex: 1;
            min-width: 0;
        }

        .blocked-info strong {
            display: block;
            overflow-wrap: anywhere;
        }

        .blocked-info p {
            margin-top: 4px;
            color: #777;
            font-size: 13px;
        }

        .unblock-btn {
            border: none;
            border-radius: 8px;
            padding: 9px 12px;
            background: #e8f0ff;
            color: #2457a6;
            font-weight: bold;
            cursor: pointer;
        }

        #blockedMessage {
            text-align: center;
            padding: 30px 10px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="blocked-page">

    <header class="blocked-header">
        <a href="/profile.html">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <h2>Blocked Users</h2>
    </header>

    <div id="blockedUsersList"></div>

    <p id="blockedMessage">Loading blocked users...</p>

</div>

<script src="/js/blocked-users.js"></script>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/call.js"></script>
</body>
</html>
