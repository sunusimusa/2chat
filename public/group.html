<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>2Chat Group</title>

<link
    rel="stylesheet"
    href="/css/group.css"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
>

</head>

<body>

<!-- ==========================
HEADER
========================== -->

<header class="group-header">

    <button
        type="button"
        onclick="history.back()"
    >

        <i class="fa-solid fa-arrow-left"></i>

    </button>

    <h2>Group</h2>

    <button
        type="button"
        id="shareBtn"
        title="Share Group"
    >

        <i class="fa-solid fa-share-nodes"></i>

    </button>

</header>


<!-- ==========================
GROUP COVER
========================== -->

<section class="group-cover">

    <img
        id="groupCover"
        src="/images/default-group-cover.jpg"
        alt="Group Cover"
    >

</section>


<!-- ==========================
GROUP AVATAR
========================== -->

<div class="group-avatar-wrapper">

    <img
        id="groupAvatar"
        src="/images/default-group.png"
        alt="Group Avatar"
    >

</div>


<!-- ==========================
GROUP INFORMATION
========================== -->

<section class="group-information">

    <h1 id="groupName">
        Loading...
    </h1>

    <p id="groupDescription">
        Loading group...
    </p>


    <div class="group-meta">

        <span>

            <i class="fa-solid fa-users"></i>

            <b id="memberCount">0</b>
            Members

        </span>


        <span>

            <i class="fa-solid fa-lock"></i>

            <span id="privacyText">
                Public
            </span>

        </span>

    </div>

</section>


<!-- ==========================
GROUP LINK
========================== -->

<section class="group-link-card">

    <div class="link-icon">

        <i class="fa-solid fa-link"></i>

    </div>


    <div class="link-content">

        <h3>
            Group Link
        </h3>

        <p id="groupLink">
            Loading...
        </p>

    </div>


    <button
        id="copyLinkBtn"
        type="button"
        title="Copy Link"
    >

        <i class="fa-solid fa-copy"></i>

    </button>

</section>


<!-- ==========================
JOIN AREA
========================== -->

<section
    id="joinSection"
    class="join-section"
>

    <button
        id="joinGroupBtn"
        type="button"
    >

        <i class="fa-solid fa-user-plus"></i>

        Join Group

    </button>

</section>


<!-- ==========================
OPEN GROUP
========================== -->

<section
    id="openGroupSection"
    class="open-group-section"
    style="display:none;"
>

    <button
        id="openGroupBtn"
        type="button"
    >

        <i class="fa-solid fa-comments"></i>

        Open Group

    </button>

</section>


<!-- ==========================
MESSAGE
========================== -->

<p
    id="groupMessage"
    class="group-message"
></p>


<!-- ==========================
LOADING
========================== -->

<div
    id="loading"
    class="loading"
>

    <i class="fa-solid fa-spinner fa-spin"></i>

    Loading group...

</div>


<script src="/js/group.js"></script>

</body>

</html>
