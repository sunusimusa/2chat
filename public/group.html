<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>2Chat Group</title>

<link
    rel="stylesheet"
    href="/css/group.css"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
>

</head>

<body>

<!-- ==========================
HEADER
========================== -->

<header class="group-header">

    <button
        type="button"
        onclick="history.back()"
    >

        <i class="fa-solid fa-arrow-left"></i>

    </button>

    <h2>Group</h2>

    <button
        type="button"
        id="shareGroupBtn"
        title="Share Group"
    >

        <i class="fa-solid fa-share-nodes"></i>

    </button>

</header>


<!-- ==========================
GROUP LOADING
========================== -->

<div
    id="groupLoading"
    class="group-loading"
>

    <i class="fa-solid fa-spinner fa-spin"></i>

    <p>Loading group...</p>

</div>


<!-- ==========================
GROUP CONTENT
========================== -->

<main
    id="groupContent"
    class="group-content"
    style="display:none;"
>


    <!-- ==========================
    COVER
    ========================== -->

    <div class="group-cover">

        <img
            id="groupCover"
            src="/images/default-group-cover.jpg"
            alt="Group cover"
        >

    </div>


    <!-- ==========================
    GROUP AVATAR
    ========================== -->

    <div class="group-avatar-wrapper">

        <img
            id="groupAvatar"
            src="/images/default-group.png"
            alt="Group avatar"
        >

    </div>


    <!-- ==========================
    GROUP DETAILS
    ========================== -->

    <section class="group-details">

        <h1 id="groupName">
            Loading...
        </h1>

        <p id="groupDescription">
            No description
        </p>


        <div class="group-meta">

            <span>

                <i class="fa-solid fa-users"></i>

                <b id="memberCount">
                    0
                </b>

                Members

            </span>


            <span>

                <i class="fa-solid fa-lock-open"></i>

                <span id="groupPrivacy">
                    Public
                </span>

            </span>

        </div>

    </section>


    <!-- ==========================
    GROUP LINK
    ========================== -->

    <section class="group-link-card">

        <div class="group-link-icon">

            <i class="fa-solid fa-link"></i>

        </div>


        <div class="group-link-info">

            <h3>
                Group Link
            </h3>

            <p id="groupLinkText">
                Loading...
            </p>

        </div>


        <button
            id="copyGroupLinkBtn"
            type="button"
            title="Copy Link"
        >

            <i class="fa-solid fa-copy"></i>

        </button>

    </section>


    <!-- ==========================
    JOIN
    ========================== -->

    <section
        id="joinSection"
        class="join-section"
    >

        <button
            id="joinGroupBtn"
            class="join-group-btn"
            type="button"
        >

            <i class="fa-solid fa-user-plus"></i>

            Join Group

        </button>

    </section>


    <!-- ==========================
    OPEN GROUP
    ========================== -->

    <section
        id="openGroupSection"
        class="open-group-section"
        style="display:none;"
    >

        <button
            id="openGroupBtn"
            type="button"
        >

            <i class="fa-solid fa-comments"></i>

            Open Group

        </button>

    </section>


</main>


<!-- ==========================
ERROR
========================== -->

<div
    id="groupError"
    class="group-error"
    style="display:none;"
>

    <i class="fa-solid fa-circle-exclamation"></i>

    <h3>
        Group not found
    </h3>

    <p id="groupErrorMessage">
        This group may have been deleted.
    </p>

    <button
        type="button"
        onclick="location.href='/groups.html'"
    >

        Back to Groups

    </button>

</div>


<script src="/js/group.js"></script>

</body>

</html>
