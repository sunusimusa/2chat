<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>2Chat - Buy Coins</title>

    <link
        rel="stylesheet"
        href="/css/coinPackages.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    >

</head>

<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="page-header">

        <button
            class="back-btn"
            onclick="history.back()"
        >

            <i class="fa-solid fa-arrow-left"></i>

        </button>

        <div class="header-title">

            <i class="fa-solid fa-coins"></i>

            <h1>
                Buy Coins
            </h1>

        </div>

    </header>


    <!-- =========================================
         PAGE
    ========================================== -->

    <main class="coin-page">

        <!-- INTRO -->

        <section class="intro">

            <div class="intro-icon">

                <i class="fa-solid fa-coins"></i>

            </div>

            <div>

                <h2>
                    Choose a Coin Package
                </h2>

                <p>
                    Buy coins and use them to send gifts
                    to your favorite creators.
                </p>

            </div>

        </section>


        <!-- =====================================
             MESSAGE
        ====================================== -->

        <div
            id="packageMessage"
            class="message"
        >

            🔄 Loading coin packages...

        </div>


        <!-- =====================================
             PACKAGES
        ====================================== -->

        <section
            id="packages"
            class="packages"
        >

        </section>

    </main>


    <!-- =========================================
         PURCHASE MODAL
    ========================================== -->

    <div
        id="purchaseModal"
        class="modal"
    >

        <div class="modal-box">

            <button
                id="closeModal"
                class="close-btn"
            >
                ×
            </button>

            <div class="modal-icon">

                <i class="fa-solid fa-coins"></i>

            </div>

            <h2>
                Confirm Package
            </h2>

            <div
                id="selectedPackage"
                class="selected-package"
            >

            </div>

            <p class="payment-info">

    You will be redirected to Flutterwave
    to complete your payment securely.

</p>       

            <button
    id="continueButton"
    class="continue-btn"
>
    <i class="fa-solid fa-credit-card"></i>
    Continue to Payment
            </button>

        </div>

    </div>


    <script>

        /* =========================================
           GLOBAL
        ========================================== */

        let coinPackages = [];

        let selectedPackage = null;


        /* =========================================
           ELEMENTS
        ========================================== */

        const packagesContainer =
            document.getElementById(
                "packages"
            );

        const packageMessage =
            document.getElementById(
                "packageMessage"
            );

        const purchaseModal =
            document.getElementById(
                "purchaseModal"
            );

        const selectedPackageBox =
            document.getElementById(
                "selectedPackage"
            );

        const closeModal =
            document.getElementById(
                "closeModal"
            );


        /* =========================================
           LOAD PACKAGES
        ========================================== */

        async function loadCoinPackages() {

            packageMessage.style.display =
                "block";

            packageMessage.innerText =
                "🔄 Loading coin packages...";


            try {

                const response =
                    await fetch(
                        "/api/coin-packages"
                    );


                const data =
                    await response.json();


                console.log(
                    "COIN PACKAGES:",
                    data
                );


                if (
                    !response.ok ||
                    !data.success
                ) {

                    packageMessage.innerText =
                        data.message ||
                        "Failed to load coin packages.";

                    return;

                }


                coinPackages =
                    data.packages || [];


                if (
                    !coinPackages.length
                ) {

                    packageMessage.innerText =
                        "📭 No coin packages available.";

                    return;

                }


                packageMessage.style.display =
                    "none";


                renderPackages();


            } catch (error) {

                console.error(
                    "COIN PACKAGES ERROR:",
                    error
                );


                packageMessage.innerText =
                    "❌ Unable to connect to server.";

            }

        }


        /* =========================================
           RENDER PACKAGES
        ========================================== */

        function renderPackages() {

            packagesContainer.innerHTML =
                coinPackages
                    .map(
                        packageItem =>
                            createPackageCard(
                                packageItem
                            )
                    )
                    .join("");

        }


        /* =========================================
           PACKAGE CARD
        ========================================== */

        function createPackageCard(
            packageItem
        ) {

            const coins =
                Number(
                    packageItem.coins || 0
                );


            const price =
                Number(
                    packageItem.price || 0
                );


            const currency =
                packageItem.currency ||
                "NGN";


            return `

                <article
                    class="coin-package"
                >

                    <div class="package-icon">

                        <i class="fa-solid fa-coins"></i>

                    </div>


                    <div class="package-info">

                        <h3>
                            ${formatNumber(coins)}
                            Coins
                        </h3>

                        <p>
                            Send gifts to creators
                        </p>

                    </div>


                    <div class="package-price">

                        <strong>
                            ${currencySymbol(currency)}${formatNumber(price)}
                        </strong>

                        <span>
                            1 Coin = ₦1
                        </span>

                    </div>


                    <button
                        class="buy-btn"
                        onclick="
                            selectPackage(
                                '${packageItem._id}'
                            )
                        "
                    >

                        Buy

                    </button>

                </article>

            `;

        }


        /* =========================================
           SELECT PACKAGE
        ========================================== */

        function selectPackage(
            packageId
        ) {

            selectedPackage =
                coinPackages.find(
                    item =>
                        item._id ===
                        packageId
                );


            if (!selectedPackage) {

                return;

            }


            const coins =
                Number(
                    selectedPackage.coins || 0
                );


            const price =
                Number(
                    selectedPackage.price || 0
                );


            const currency =
                selectedPackage.currency ||
                "NGN";


            selectedPackageBox.innerHTML = `

                <div class="selected-icon">

                    <i class="fa-solid fa-coins"></i>

                </div>

                <div>

                    <strong>
                        ${formatNumber(coins)}
                        Coins
                    </strong>

                    <span>
                        ${currencySymbol(currency)}
                        ${formatNumber(price)}
                    </span>

                </div>

            `;


            purchaseModal.classList.add(
                "show"
            );

        }

        /* =========================================
   CONTINUE TO PAYMENT
========================================= */

const continueButton =
    document.getElementById(
        "continueButton"
    );


continueButton.addEventListener(
    "click",
    async () => {

        if (!selectedPackage) {

            alert(
                "Please select a coin package first."
            );

            return;

        }


        const token =
            localStorage.getItem("token");


        if (!token) {

            alert(
                "Please login first."
            );

            location.href =
                "/login.html";

            return;

        }


        try {

            continueButton.disabled = true;

            continueButton.innerHTML = `
                <i class="fa-solid fa-spinner fa-spin"></i>
                Processing...
            `;


            /* =====================================
               STEP 1
               CREATE PURCHASE ORDER
            ===================================== */

            const orderResponse =
                await fetch(
                    "/api/coin-purchases",
                    {
                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Authorization":
                                "Bearer " + token

                        },

                        body: JSON.stringify({

                            packageId:
                                selectedPackage._id

                        })

                    }
                );


            const orderData =
                await orderResponse.json();


            if (
                !orderResponse.ok ||
                !orderData.success
            ) {

                throw new Error(
                    orderData.message ||
                    "Failed to create purchase order."
                );

            }


            const purchaseId =
                orderData.purchase.id ||
                orderData.purchase._id;


            if (!purchaseId) {

                throw new Error(
                    "Purchase ID was not returned."
                );

            }

            window.location.href =
            "/html/coinPayment.html";

            /* =====================================
               STEP 2
               INITIALIZE FLUTTERWAVE PAYMENT
            ===================================== */

            const paymentResponse =
                await fetch(
                    `/api/coin-purchases/${purchaseId}/initialize-payment`,
                    {
                        method: "POST",

                        headers: {

                            "Authorization":
                                "Bearer " + token

                        }

                    }
                );


            const paymentData =
                await paymentResponse.json();


            if (
                !paymentResponse.ok ||
                !paymentData.success
            ) {

                throw new Error(
                    paymentData.message ||
                    "Failed to initialize payment."
                );

            }


            /* =====================================
               STEP 3
               GET CHECKOUT URL
            ===================================== */

            const payment =
                paymentData.payment;


            if (
                !payment ||
                !payment.checkoutUrl
            ) {

                throw new Error(
                    "Flutterwave checkout URL was not returned."
                );

            }


            /* =====================================
               STEP 4
               OPEN FLUTTERWAVE
            ===================================== */

            window.location.href =
                payment.checkoutUrl;


        } catch (error) {

            console.error(
                "COIN PAYMENT ERROR:",
                error
            );


            alert(
                "❌ " +
                (
                    error.message ||
                    "Unable to start payment."
                )
            );


            continueButton.disabled =
                false;


            continueButton.innerHTML = `
                <i class="fa-solid fa-credit-card"></i>
                Continue to Payment
            `;

        }

    }
);


        /* =========================================
           CLOSE MODAL
        ========================================== */

        closeModal.addEventListener(
            "click",
            () => {

                purchaseModal.classList.remove(
                    "show"
                );

            }
        );


        purchaseModal.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    purchaseModal
                ) {

                    purchaseModal.classList.remove(
                        "show"
                    );

                }

            }
        );


        /* =========================================
           HELPERS
        ========================================== */

        function formatNumber(
            value
        ) {

            return Number(
                value || 0
            ).toLocaleString(
                "en-NG"
            );

        }


        function currencySymbol(
            currency
        ) {

            if (
                currency ===
                "NGN"
            ) {

                return "₦";

            }


            return currency + " ";

        }


        /* =========================================
           START
        ========================================== */

        loadCoinPackages();

    </script>

</body>

</html>
