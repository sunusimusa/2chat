<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>2Chat - Admin Management</title>

<link
    rel="stylesheet"
    href="/css/group-admins.css"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
>

</head>

<body>


<!-- ==========================
HEADER
========================== -->

<header class="admin-header">

    <button
        id="backButton"
        type="button"
    >

        <i class="fa-solid fa-arrow-left"></i>

    </button>

    <h2>
        Admin Management
    </h2>

    <div></div>

</header>


<!-- ==========================
GROUP INFO
========================== -->

<section
    id="groupInfo"
    class="group-info"
>

    <img
        id="groupAvatar"
        src="/images/default-group.png"
        alt="Group"
    >

    <div>

        <h3 id="groupName">
            Loading...
        </h3>

        <p id="groupMembersCount">
            Loading members...
        </p>

    </div>

</section>


<!-- ==========================
MEMBERS
========================== -->

<div class="section-title">

    <i class="fa-solid fa-users"></i>

    Group Members

</div>


<div
    id="membersList"
    class="members-list"
>

    <div class="loading">

        Loading members...

    </div>

</div>


<!-- ==========================
MESSAGE
========================== -->

<div
    id="adminMessage"
    class="admin-message"
></div>


<script src="/js/group-admins.js"></script>

</body>

</html>
