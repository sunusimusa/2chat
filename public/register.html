<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>2Chat Register</title>

    <link rel="stylesheet" href="/css/register.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    >

    <!-- International Phone Input CSS -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/intl-tel-input@29.5.8/dist/css/intlTelInput.css"
    >

    <style>
        .legal-text {
            margin-top: 18px;
            text-align: center;
            font-size: 13px;
            line-height: 1.6;
            color: #777;
        }

        .legal-text a {
            color: #ff0874;
            text-decoration: none;
            font-weight: 600;
        }

        .legal-text a:hover {
            text-decoration: underline;
        }

        .password-group {
            position: relative;
        }

        .password-group input {
            padding-right: 48px;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #777;
            cursor: pointer;
            font-size: 16px;
            padding: 5px;
        }

        /* INTERNATIONAL PHONE INPUT */
        .phone-group .iti {
            flex: 1;
            width: 100%;
            min-width: 0;
        }

        .phone-group .iti input {
            width: 100%;
            box-sizing: border-box;
        }

        .phone-group .iti__dropdown-content {
            z-index: 9999;
        }

        
/* FIX INTERNATIONAL COUNTRY FLAGS */
.iti {
    --iti-path-flags-1x: url("https://cdn.jsdelivr.net/npm/intl-tel-input@29.5.8/dist/img/flags.webp");
    --iti-path-flags-2x: url("https://cdn.jsdelivr.net/npm/intl-tel-input@29.5.8/dist/img/flags@2x.webp");
}

/* KEEP PHONE ICON VISIBLE */
.phone-group > .fa-phone {
    display: inline-block !important;
    flex: 0 0 auto;
}

.phone-group .iti {
    flex: 1;
    width: 100%;
    min-width: 0;
}
        
    </style>
</head>

<body>

<div class="register-container">

    <div class="register-logo">
        <i class="fa-solid fa-user-plus"></i>
    </div>

    <h2>Create 2Chat Account</h2>

    <p class="register-subtitle">
        Join 2Chat and connect with your community.
    </p>

    <!-- USERNAME -->
    <div class="input-group">
        <i class="fa-solid fa-user"></i>
        <input
            id="username"
            type="text"
            placeholder="Username"
            autocomplete="username"
        >
    </div>

    <!-- EMAIL -->
    <div class="input-group">
        <i class="fa-solid fa-envelope"></i>
        <input
            id="email"
            type="email"
            placeholder="Email"
            autocomplete="email"
        >
    </div>

    <!-- INTERNATIONAL PHONE NUMBER -->
    <div class="input-group phone-group">
        <i class="fa-solid fa-phone"></i>
        <input
            id="phoneNumber"
            type="tel"
            placeholder="Phone Number"
            autocomplete="tel"
        >
    </div>

    <!-- DATE OF BIRTH -->
    <div class="input-group">
        <i class="fa-solid fa-calendar"></i>
        <input
            id="dateOfBirth"
            type="date"
            autocomplete="bday"
            aria-label="Date of birth"
        >
    </div>

    <!-- PASSWORD -->
    <div class="input-group password-group">
        <i class="fa-solid fa-lock"></i>

        <input
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="new-password"
        >

        <button
            type="button"
            class="password-toggle"
            onclick="togglePassword('password', 'passwordEye')"
            aria-label="Show password"
        >
            <i id="passwordEye" class="fa-solid fa-eye"></i>
        </button>
    </div>

    <!-- CONFIRM PASSWORD -->
    <div class="input-group password-group">
        <i class="fa-solid fa-lock"></i>

        <input
            id="confirmPassword"
            type="password"
            placeholder="Confirm Password"
            autocomplete="new-password"
        >

        <button
            type="button"
            class="password-toggle"
            onclick="togglePassword('confirmPassword', 'confirmPasswordEye')"
            aria-label="Show confirm password"
        >
            <i id="confirmPasswordEye" class="fa-solid fa-eye"></i>
        </button>
    </div>

    <!-- REGISTER -->
    <button
        id="registerButton"
        class="register-btn"
        type="button"
        onclick="register()"
    >
        <i class="fa-solid fa-user-plus"></i>
        Register
    </button>

    <p id="msg"></p>

    
<!-- EMAIL OTP VERIFICATION -->
<div id="otpSection" style="display:none; margin-top:20px;">

    <h3>Verify Your Email</h3>

    <p>
        We sent a 6-digit verification code to your email address.
    </p>

    <input
        id="emailOtp"
        type="text"
        inputmode="numeric"
        maxlength="6"
        placeholder="Enter 6-digit code"
        autocomplete="one-time-code"
        style="width:100%; padding:14px; margin:12px 0; text-align:center; letter-spacing:8px;"
    >

    <button
        id="verifyOtpButton"
        type="button"
        class="register-btn"
        onclick="verifyEmailOtp()"
    >
        Verify Email
    </button>

    <button
        id="resendOtpButton"
        type="button"
        onclick="resendEmailOtp()"
        style="margin-top:12px;"
    >
        Resend Code
    </button>

    <p id="otpMsg"></p>

</div>
    
    <!-- TERMS & PRIVACY -->
    <p class="legal-text">
        By creating a 2Chat account, you agree to our
        <a href="/terms.html">Terms of Service</a>
        and acknowledge our
        <a href="/privacy.html">Privacy Policy</a>.
    </p>

    <!-- LOGIN -->
    <p class="login-text">
        Already have an account?
        <a href="/login.html">Login Here</a>
    </p>

</div>

<!-- INTERNATIONAL PHONE INPUT JS -->
<script src="https://cdn.jsdelivr.net/npm/intl-tel-input@29.5.8/dist/js/intlTelInput.min.js"></script>

<script>
 
// =========================================
// INTERNATIONAL PHONE INPUT
// =========================================

const phoneInput = document.getElementById("phoneNumber");

const phoneITI = window.intlTelInput(phoneInput, {
    initialCountry: "ng",
    separateDialCode: false,
    nationalMode: false,
    formatAsYouType: true,
    loadUtils: () => import(
        "https://cdn.jsdelivr.net/npm/intl-tel-input@29.5.8/dist/js/utils.js"
    )
});

// =========================================
// ELEMENTS
// =========================================

const msg = document.getElementById("msg");
const otpMsg = document.getElementById("otpMsg");

const registerButton =
    document.getElementById("registerButton");

const otpSection =
    document.getElementById("otpSection");

const verifyOtpButton =
    document.getElementById("verifyOtpButton");

const resendOtpButton =
    document.getElementById("resendOtpButton");

let pendingEmail = "";
let resendTimer = null;

// =========================================
// PASSWORD VISIBILITY
// =========================================

function togglePassword(inputId, eyeId) {
    const input = document.getElementById(inputId);
    const eye = document.getElementById(eyeId);

    if (input.type === "password") {
        input.type = "text";
        eye.classList.remove("fa-eye");
        eye.classList.add("fa-eye-slash");
    } else {
        input.type = "password";
        eye.classList.remove("fa-eye-slash");
        eye.classList.add("fa-eye");
    }
}

// =========================================
// SAFE REDIRECT AFTER AUTHENTICATION
// =========================================

function redirectAfterAuthentication() {
    const redirect =
        localStorage.getItem("afterAuthRedirect");

    localStorage.removeItem("afterAuthRedirect");

    if (
        redirect &&
        redirect.startsWith("/") &&
        !redirect.startsWith("//")
    ) {
        location.href = redirect;
        return;
    }

    location.href = "/home.html";
}

// =========================================
// SHOW OTP SECTION
// =========================================

function showOtpSection(email) {
    pendingEmail = email;

    document.querySelectorAll(".input-group").forEach(element => {
        element.style.display = "none";
    });

    registerButton.style.display = "none";

    otpSection.style.display = "block";

    msg.innerText = "";

    otpMsg.innerText =
        "A verification code has been sent to " + email;

    document.getElementById("emailOtp").focus();

    startResendCountdown(60);
}

// =========================================
// RESEND COUNTDOWN
// =========================================

function startResendCountdown(seconds) {
    clearInterval(resendTimer);

    let remaining = seconds;

    resendOtpButton.disabled = true;

    resendOtpButton.innerText =
        `Resend Code (${remaining}s)`;

    resendTimer = setInterval(() => {
        remaining--;

        if (remaining <= 0) {
            clearInterval(resendTimer);

            resendOtpButton.disabled = false;
            resendOtpButton.innerText = "Resend Code";

            return;
        }

        resendOtpButton.innerText =
            `Resend Code (${remaining}s)`;

    }, 1000);
}

// =========================================
// REGISTER
// =========================================

async function register() {

    const username =
        document.getElementById("username").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const dateOfBirth =
        document.getElementById("dateOfBirth").value;

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if (
        !username ||
        !email ||
        !phoneInput.value.trim() ||
        !dateOfBirth ||
        !password ||
        !confirmPassword
    ) {
        msg.innerText = "Please fill in all fields.";
        return;
    }

    if (password.length < 8 || password.length > 128) {
        msg.innerText =
            "Password must be between 8 and 128 characters.";
        return;
    }

    if (password !== confirmPassword) {
        msg.innerText = "Passwords do not match.";
        return;
    }

    const dob = new Date(dateOfBirth + "T00:00:00");

    if (Number.isNaN(dob.getTime()) || dob > new Date()) {
        msg.innerText = "Please enter a valid date of birth.";
        return;
    }

    buttonLoading(true, "Creating Account...");

    try {
        await phoneITI.promise;

        if (!phoneITI.isValidNumber()) {
            msg.innerText =
                "Please enter a valid international phone number.";

            return;
        }

        const phoneNumber = phoneITI.getNumber();

        const res = await fetch("/api/auth/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username,
                email,
                phoneNumber,
                dateOfBirth,
                password
            })
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
            msg.innerText =
                data.message || "Registration failed.";

            return;
        }

        if (!data.token || !data.user) {
            msg.innerText = "Account was created but sign-in details are missing. Please contact support.";
            return;
        }

        localStorage.setItem("token", data.token);
        localStorage.setItem("user", JSON.stringify(data.user));

        msg.innerText = "Account created successfully! Redirecting...";
        redirectAfterAuthentication();

    } catch (error) {
        console.error("REGISTER ERROR:", error);

        msg.innerText =
            "Network or phone validation error. Please try again.";

    } finally {
        buttonLoading(false, "Register");
    }
}

// =========================================
// BUTTON LOADING
// =========================================

function buttonLoading(loading, label) {
    registerButton.disabled = loading;

    registerButton.innerHTML = loading
        ? `<i class="fa-solid fa-spinner fa-spin"></i> ${label}`
        : `<i class="fa-solid fa-user-plus"></i> ${label}`;
}

// =========================================
// VERIFY EMAIL OTP
// =========================================

async function verifyEmailOtp() {

    const otp =
        document.getElementById("emailOtp").value.trim();

    if (!pendingEmail) {
        otpMsg.innerText =
            "Registration email is missing. Please register again.";
        return;
    }

    if (!/^\d{6}$/.test(otp)) {
        otpMsg.innerText =
            "Please enter a valid 6-digit verification code.";
        return;
    }

    verifyOtpButton.disabled = true;

    verifyOtpButton.innerHTML =
        `<i class="fa-solid fa-spinner fa-spin"></i> Verifying...`;

    otpMsg.innerText = "";

    try {
        const res = await fetch("/api/auth/verify-email-otp", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: pendingEmail,
                otp
            })
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
            otpMsg.innerText =
                data.message || "Email verification failed.";

            return;
        }

        if (!data.token || !data.user) {
            otpMsg.innerText =
                "Verification succeeded but login details are missing. Please contact support.";
            return;
        }

        // SAVE AUTHENTICATION DATA
        localStorage.setItem("token", data.token);

        localStorage.setItem(
            "user",
            JSON.stringify(data.user)
        );

        otpMsg.innerText =
            "Email verified successfully! Redirecting...";

        redirectAfterAuthentication();

    } catch (error) {
        console.error("OTP VERIFICATION ERROR:", error);

        otpMsg.innerText =
            "Network error. Please try again.";

    } finally {
        verifyOtpButton.disabled = false;

        verifyOtpButton.innerText = "Verify Email";
    }
}

// =========================================
// RESEND EMAIL OTP
// =========================================

async function resendEmailOtp() {

    if (!pendingEmail) {
        otpMsg.innerText =
            "Registration email is missing. Please register again.";
        return;
    }

    resendOtpButton.disabled = true;

    resendOtpButton.innerText = "Sending...";

    otpMsg.innerText = "";

    try {
        const res = await fetch("/api/auth/resend-email-otp", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: pendingEmail
            })
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
            otpMsg.innerText =
                data.message || "Unable to resend verification code.";

            if (data.retryAfterSeconds) {
                startResendCountdown(data.retryAfterSeconds);
            } else {
                resendOtpButton.disabled = false;
                resendOtpButton.innerText = "Resend Code";
            }

            return;
        }

        otpMsg.innerText =
            "A new verification code has been sent.";

        document.getElementById("emailOtp").value = "";

        startResendCountdown(60);

    } catch (error) {
        console.error("RESEND OTP ERROR:", error);

        otpMsg.innerText =
            "Network error. Please try again.";

        resendOtpButton.disabled = false;
        resendOtpButton.innerText = "Resend Code";
    }
}

// =========================================
// OTP INPUT: NUMBERS ONLY
// =========================================

document.getElementById("emailOtp").addEventListener(
    "input",
    function () {
        this.value = this.value.replace(/\D/g, "").slice(0, 6);
    }
);
    
</script>

</body>
</html>
