<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>2Chat Register</title>

    <!-- REGISTER CSS -->
    <link
        rel="stylesheet"
        href="/css/register.css"
    >

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    >

</head>


<body>


<div class="register-container">


    <!-- ==========================
         LOGO
    =========================== -->

    <div class="register-logo">

        <i class="fa-solid fa-user-plus"></i>

    </div>


    <!-- ==========================
         TITLE
    =========================== -->

    <h2>
        Create 2Chat Account
    </h2>


    <p class="register-subtitle">
        Join 2Chat and connect with your community.
    </p>


    <!-- ==========================
         USERNAME
    =========================== -->

    <div class="input-group">

        <i class="fa-solid fa-user"></i>

        <input
            id="username"
            type="text"
            placeholder="Username"
            autocomplete="username"
        >

    </div>


    <!-- ==========================
         EMAIL
    =========================== -->

    <div class="input-group">

        <i class="fa-solid fa-envelope"></i>

        <input
            id="email"
            type="email"
            placeholder="Email"
            autocomplete="email"
        >

    </div>


    <!-- ==========================
         PASSWORD
    =========================== -->

    <div class="input-group">

        <i class="fa-solid fa-lock"></i>

        <input
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="new-password"
        >

    </div>


    <!-- ==========================
         REGISTER
    =========================== -->

    <button
        id="registerButton"
        class="register-btn"
        type="button"
        onclick="register()"
    >

        <i class="fa-solid fa-user-plus"></i>

        Register

    </button>


    <!-- ==========================
         MESSAGE
    =========================== -->

    <p id="msg"></p>


    <!-- ==========================
         LOGIN
    =========================== -->

    <p class="login-text">

        Already have an account?

        <a href="/login.html">
            Login Here
        </a>

    </p>


</div>



<script>

async function register() {

    const username =
        document.getElementById("username").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const msg =
        document.getElementById("msg");

    const button =
        document.getElementById("registerButton");


    // ==========================
    // VALIDATION
    // ==========================

    if (!username || !email || !password) {

        msg.innerText =
            "Please fill in all fields.";

        return;

    }


    if (password.length < 6) {

        msg.innerText =
            "Password must be at least 6 characters.";

        return;

    }


    // ==========================
    // LOADING
    // ==========================

    button.disabled = true;

    button.innerHTML = `
        <i class="fa-solid fa-spinner fa-spin"></i>
        Creating Account...
    `;

    msg.innerText = "";


    try {

        const res =
            await fetch(
                "/api/auth/register",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        username,
                        email,
                        password

                    })

                }
            );


        const data =
            await res.json();


        // ==========================
        // SUCCESS
        // ==========================

        
if(data.success){

    localStorage.setItem(
        "token",
        data.token
    );

    /*
    SAVE USER
    */

    if(data.user){

        localStorage.setItem(
            "user",
            JSON.stringify(data.user)
        );

    }

    const afterAuthRedirect =
    localStorage.getItem("afterAuthRedirect");

if (afterAuthRedirect) {

    localStorage.removeItem("afterAuthRedirect");

    location.href = afterAuthRedirect;

    return;
}

    /*
    NORMAL REGISTER
    */

    location.href =
        "/home.html";

}

        // ==========================
        // ERROR
        // ==========================

        msg.innerText =
            data.message ||
            "Registration failed.";


    } catch (error) {

        console.error(
            "REGISTER ERROR:",
            error
        );

        msg.innerText =
            "Network error. Please try again.";

    }


    // ==========================
    // RESTORE BUTTON
    // ==========================

    button.disabled = false;

    button.innerHTML = `
        <i class="fa-solid fa-user-plus"></i>
        Register
    `;

}

</script>


</body>

</html>
