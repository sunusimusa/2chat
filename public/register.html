<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>2Chat Register</title>

    <!-- REGISTER CSS -->
    <link
        rel="stylesheet"
        href="/css/register.css"
    >

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    >

    <style>

        /* ==========================
           LEGAL
        =========================== */

        .legal-text {

            margin-top: 18px;

            text-align: center;

            font-size: 13px;

            line-height: 1.6;

            color: #777;

        }


        .legal-text a {

            color: #ff0874;

            text-decoration: none;

            font-weight: 600;

        }


        .legal-text a:hover {

            text-decoration: underline;

        }

        
.password-group {
    position: relative;
}

.password-group input {
    padding-right: 48px;
}

.password-toggle {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    color: #777;
    cursor: pointer;
    font-size: 16px;
    padding: 5px;
}
        

    </style>

</head>


<body>


<div class="register-container">


    <!-- ==========================
         LOGO
    =========================== -->

    <div class="register-logo">

        <i class="fa-solid fa-user-plus"></i>

    </div>


    <!-- ==========================
         TITLE
    =========================== -->

    <h2>
        Create 2Chat Account
    </h2>


    <p class="register-subtitle">
        Join 2Chat and connect with your community.
    </p>


    <!-- ==========================
         USERNAME
    =========================== -->

    <div class="input-group">

        <i class="fa-solid fa-user"></i>

        <input
            id="username"
            type="text"
            placeholder="Username"
            autocomplete="username"
        >

    </div>


    <!-- ==========================
         EMAIL
    =========================== -->

    <div class="input-group">

        <i class="fa-solid fa-envelope"></i>

        <input
            id="email"
            type="email"
            placeholder="Email"
            autocomplete="email"
        >

    </div>

    
    <!-- ==========================
         PHONE NUMBER
    =========================== -->

    <div class="input-group">

        <i class="fa-solid fa-phone"></i>

        <input
            id="phoneNumber"
            type="tel"
            placeholder="Phone Number (e.g. +2348012345678)"
            autocomplete="tel"
        >

    </div>


    <!-- ==========================
         DATE OF BIRTH
    =========================== -->

    <div class="input-group">

        <i class="fa-solid fa-calendar"></i>

        <input
            id="dateOfBirth"
            type="date"
            autocomplete="bday"
            aria-label="Date of birth"
        >

    </div>
    

    <!-- ==========================
         PASSWORD
    =========================== -->
    
<!-- PASSWORD -->
<div class="input-group password-group">
    <i class="fa-solid fa-lock"></i>

    <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="new-password"
    >

    <button
        type="button"
        class="password-toggle"
        onclick="togglePassword('password', 'passwordEye')"
        aria-label="Show password"
    >
        <i id="passwordEye" class="fa-solid fa-eye"></i>
    </button>
</div>

<!-- CONFIRM PASSWORD -->
<div class="input-group password-group">
    <i class="fa-solid fa-lock"></i>

    <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm Password"
        autocomplete="new-password"
    >

    <button
        type="button"
        class="password-toggle"
        onclick="togglePassword('confirmPassword', 'confirmPasswordEye')"
        aria-label="Show confirm password"
    >
        <i id="confirmPasswordEye" class="fa-solid fa-eye"></i>
    </button>
</div>

    <!-- ==========================
         REGISTER
    =========================== -->

    <button
        id="registerButton"
        class="register-btn"
        type="button"
        onclick="register()"
    >

        <i class="fa-solid fa-user-plus"></i>

        Register

    </button>


    <!-- ==========================
         MESSAGE
    =========================== -->

    <p id="msg"></p>


    <!-- ==========================
         TERMS & PRIVACY
    =========================== -->

    <p class="legal-text">

        By creating a 2Chat account, you agree to our

        <a href="/terms.html">
            Terms of Service
        </a>

        and acknowledge our

        <a href="/privacy.html">
            Privacy Policy
        </a>.

    </p>


    <!-- ==========================
         LOGIN
    =========================== -->

    <p class="login-text">

        Already have an account?

        <a href="/login.html">
            Login Here
        </a>

    </p>


</div>



<script>

    
function togglePassword(inputId, eyeId) {
    const input = document.getElementById(inputId);
    const eye = document.getElementById(eyeId);

    if (input.type === "password") {
        input.type = "text";
        eye.classList.remove("fa-eye");
        eye.classList.add("fa-eye-slash");
    } else {
        input.type = "password";
        eye.classList.remove("fa-eye-slash");
        eye.classList.add("fa-eye");
    }
}    

async function register() {

    const username =
        document.getElementById("username").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
    document.getElementById("confirmPassword").value;

    const msg =
        document.getElementById("msg");

    const button =
        document.getElementById("registerButton");


    // ==========================
    // VALIDATION
    // ==========================
    
if (!username || !email || !password || !confirmPassword) {
    msg.innerText = "Please fill in all fields.";
    return;
}

if (password.length < 8 || password.length > 128) {
    msg.innerText = "Password must be between 8 and 128 characters.";
    return;
}

if (password !== confirmPassword) {
    msg.innerText = "Passwords do not match.";
    return;
}
    
    // ==========================
    // LOADING
    // ==========================

    button.disabled = true;

    button.innerHTML = `
        <i class="fa-solid fa-spinner fa-spin"></i>
        Creating Account...
    `;

    msg.innerText = "";


    try {

        const res =
            await fetch(
                "/api/auth/register",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        username,
                        email,
                        password

                    })

                }
            );


        const data =
            await res.json();


        // ==========================
        // SUCCESS
        // ==========================

        if(data.success){

            localStorage.setItem(
                "token",
                data.token
            );


            /*
            SAVE USER
            */

            if(data.user){

                localStorage.setItem(
                    "user",
                    JSON.stringify(data.user)
                );

            }


            const afterAuthRedirect =
                localStorage.getItem(
                    "afterAuthRedirect"
                );


            if (afterAuthRedirect) {

                localStorage.removeItem(
                    "afterAuthRedirect"
                );

                location.href =
                    afterAuthRedirect;

                return;

            }


            /*
            NORMAL REGISTER
            */

            location.href =
                "/home.html";

        }


        // ==========================
        // ERROR
        // ==========================

        msg.innerText =
            data.message ||
            "Registration failed.";


    } catch (error) {

        console.error(
            "REGISTER ERROR:",
            error
        );

        msg.innerText =
            "Network error. Please try again.";

    }


    // ==========================
    // RESTORE BUTTON
    // ==========================

    button.disabled = false;

    button.innerHTML = `
        <i class="fa-solid fa-user-plus"></i>
        Register
    `;

}

</script>


</body>

    </html>
