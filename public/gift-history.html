<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>2Chat Gift History</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {

            font-family: Arial, sans-serif;

            background: #f5f5f5;

            color: #222;

            padding: 20px;

        }


        .container {

            width: 100%;

            max-width: 600px;

            margin: 0 auto;

        }


        /* ==========================
           HEADER
        ========================== */

        h1 {

            text-align: center;

            margin: 5px 0 20px;

            font-size: 26px;

        }


        /* ==========================
           MESSAGE
        ========================== */

        #message {

            text-align: center;

            margin: 15px 0;

            font-size: 14px;

            color: #666;

        }


        /* ==========================
           GIFT LIST
        ========================== */

        #giftList {

            width: 100%;

        }


        /* ==========================
           GIFT CARD
        ========================== */

        .gift {

            background: #fff;

            padding: 16px;

            margin-bottom: 12px;

            border-radius: 14px;

            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, .08);

        }


        /* ==========================
           TOP
        ========================== */

        .gift-top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

        }


        .gift-type {

            font-size: 18px;

            font-weight: bold;

            color: #222;

        }


        .coins {

            color: #ff0874;

            font-weight: bold;

            white-space: nowrap;

        }


        /* ==========================
           INFO
        ========================== */

        .info {

            margin-top: 10px;

            color: #555;

            line-height: 1.7;

            font-size: 14px;

        }


        .info strong {

            color: #222;

        }


        /* ==========================
           EMPTY
        ========================== */

        .empty {

            text-align: center;

            padding: 35px 20px;

            color: #777;

            background: #fff;

            border-radius: 14px;

            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, .06);

        }


        /* ==========================
           ERROR
        ========================== */

        .error {

            text-align: center;

            padding: 30px 20px;

            background: #fff;

            border-radius: 14px;

            color: #d32f2f;

        }


        /* ==========================
           LOADING
        ========================== */

        .loading {

            text-align: center;

            padding: 30px 20px;

            color: #777;

        }


        /* ==========================
           MOBILE
        ========================== */

        @media (max-width: 480px) {

            body {

                padding: 15px;

            }

            h1 {

                font-size: 23px;

            }

            .gift {

                padding: 14px;

            }

            .gift-type {

                font-size: 17px;

            }

            .coins {

                font-size: 14px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        🎁 Gift History
    </h1>


    <div id="message">
        Loading gift history...
    </div>


    <div id="giftList"></div>


</div>



<script>

/* ==========================================================
   LOAD GIFT HISTORY
========================================================== */

async function loadGiftHistory() {

    const message =
        document.getElementById("message");

    const giftList =
        document.getElementById("giftList");


    if (!message || !giftList) {

        console.error(
            "Gift History elements not found."
        );

        return;

    }


    /* ==========================
       TOKEN
    ========================== */

    const token =
        localStorage.getItem("token");


    if (!token) {

        message.innerText =
            "❌ Login required";

        giftList.innerHTML = `
            <div class="error">
                🔐 Please login to view your gift history.
            </div>
        `;

        return;

    }


    /* ==========================
       LOADING
    ========================== */

    message.innerText =
        "Loading gift history...";

    giftList.innerHTML = `
        <div class="loading">
            ⏳ Please wait...
        </div>
    `;


    try {


        /* ==========================
           API REQUEST
        ========================== */

        const res =
            await fetch(
                "/api/gifts/received",
                {

                    method: "GET",

                    headers: {

                        "Authorization":
                            "Bearer " + token,

                        "Content-Type":
                            "application/json"

                    }

                }
            );


        /* ==========================
           RESPONSE
        ========================== */

        const data =
            await res.json();


        console.log(
            "RECEIVED GIFTS:",
            data
        );


        if (!res.ok || !data.success) {

            message.innerText =
                "❌ Failed to load gift history.";

            giftList.innerHTML = `
                <div class="error">
                    ❌ ${
                        escapeHTML(
                            data.message ||
                            "Unable to load gifts."
                        )
                    }
                </div>
            `;

            return;

        }


        /* ==========================
           GIFTS
        ========================== */

        const gifts =
            Array.isArray(data.gifts)
                ? data.gifts
                : [];


        /* ==========================
           EMPTY
        ========================== */

        if (gifts.length === 0) {

            message.innerText =
                "No gifts received yet.";

            giftList.innerHTML = `
                <div class="empty">

                    <div
                        style="
                            font-size:42px;
                            margin-bottom:10px;
                        "
                    >
                        🎁
                    </div>

                    <div>
                        No gifts received yet.
                    </div>

                </div>
            `;

            return;

        }


        /* ==========================
           SUCCESS
        ========================== */

        message.innerText =
            `${gifts.length} gift${
                gifts.length === 1
                    ? ""
                    : "s"
            } received`;


        giftList.innerHTML = "";


        /* ==========================
           RENDER GIFTS
        ========================== */

        gifts.forEach(gift => {


            const sender =
                gift.senderId &&
                typeof gift.senderId === "object"
                    ? gift.senderId
                    : {};


            const senderName =
                sender.username ||
                sender.name ||
                "Unknown User";


            const giftType =
                gift.giftType ||
                "Gift";


            const coins =
                Number(
                    gift.coins || 0
                );


            const creatorEarning =
                Number(
                    gift.creatorEarning || 0
                );


            let date =
                "Unknown date";


            if (gift.createdAt) {

                const parsedDate =
                    new Date(
                        gift.createdAt
                    );


                if (
                    !isNaN(
                        parsedDate.getTime()
                    )
                ) {

                    date =
                        parsedDate.toLocaleString(
                            "en-NG",
                            {
                                dateStyle:
                                    "medium",

                                timeStyle:
                                    "short"
                            }
                        );

                }

            }


            /* ==========================
               CARD
            ========================== */

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "gift";


            item.innerHTML = `

                <div class="gift-top">

                    <div class="gift-type">

                        🎁
                        ${escapeHTML(
                            giftType
                        )}

                    </div>


                    <div class="coins">

                        ${coins}
                        coins

                    </div>

                </div>


                <div class="info">

                    👤 From:
                    <strong>
                        ${escapeHTML(
                            senderName
                        )}
                    </strong>

                    <br>


                    💰 Creator earning:
                    <strong>
                        ${creatorEarning}
                        coins
                    </strong>

                    <br>


                    📅
                    ${escapeHTML(
                        date
                    )}

                </div>

            `;


            giftList.appendChild(
                item
            );

        });


    } catch (err) {

        console.error(
            "GIFT HISTORY ERROR:",
            err
        );


        message.innerText =
            "❌ Server connection error";


        giftList.innerHTML = `
            <div class="error">

                ❌ Unable to connect
                to the server.

                <br><br>

                Please try again later.

            </div>
        `;

    }

}



/* ==========================================================
   SAFE HTML
========================================================== */

function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}



/* ==========================================================
   AUTO LOAD
========================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadGiftHistory();

    }
);

</script>


</body>

    </html>
