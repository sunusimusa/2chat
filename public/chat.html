<!DOCTYPE html>  
<html lang="en">  
  
<head>  
  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
  
<title>2Chat Chat</title>  
  
<link rel="stylesheet" href="/css/chat.css">  
  
<link rel="stylesheet"  
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">  
  
</head>  
  
<body>  
  
<!-- ==========================  
MESSAGE MENU  
========================== -->  
  
<div id="messageMenu" class="message-menu">  
  
    <div onclick="replySelected()">  
        <i class="fa-solid fa-reply"></i>  
        <span>Reply</span>  
    </div>  
  
    <div onclick="reactSelected()">  
        <i class="fa-regular fa-face-smile"></i>  
        <span>React</span>  
    </div>  
  
    <div id="deleteMeOption" onclick="deleteSelected()">  
        <i class="fa-solid fa-trash"></i>  
        <span>Delete for me</span>  
    </div>  
  
    <div id="deleteAllOption" onclick="deleteEveryoneSelected()">  
        <i class="fa-solid fa-trash-can"></i>  
        <span>Delete for everyone</span>  
    </div>  
  
</div>  
  
<!-- ==========================  
CHAT MENU  
========================== -->  
  
<div id="chatMenu" class="chat-menu">  
  
    <div onclick="clearChat()">  
        <i class="fa-solid fa-trash"></i>  
        <span>Clear Chat</span>  
    </div>  
  
</div>  
  
<!-- ==========================  
HEADER  
========================== -->  
  
<header class="chat-header">  
  
    <button  
    class="back-btn"  
    onclick="history.back()">  
  
        <i class="fa-solid fa-arrow-left"></i>  
  
    </button>  
  
    <div class="chat-user">  
  
        <img  
        id="chatAvatar"  
        src="/images/default.png"  
        class="chat-avatar">  
  
        <div class="chat-info">  
  
            <h3 id="chatName">  
                Loading...  
            </h3>  
  
            <p id="status">  
  
                <i class="fa-solid fa-circle online-dot"></i>  
  
                Offline  
  
            </p>  
  
            <p id="typing" style="display:none;">  
  
                <i class="fa-solid fa-pen"></i>  
  
                Typing...  
  
            </p>  
  
        </div>  
  
    </div>  
  
    <div class="header-actions">  
  
        <button  
        class="header-btn"  
        onclick="toggleChatMenu()">  
  
            <i class="fa-solid fa-ellipsis-vertical"></i>  
  
        </button>  
  
    </div>  
  
</header>  
  
<!-- ==========================  
CHAT AREA  
========================== -->  
  
<div  
id="chat"  
class="chat-container">  
  
</div>  
  
  <!-- ==========================  
IMAGE PREVIEW  
========================== -->  
  
<div  
id="previewBox"  
class="preview-box"  
style="display:none;">  
  
    <img id="previewImage">  
  
    <div class="preview-actions">  
  
        <button  
        type="button"  
        onclick="removeImage()">  
  
            <i class="fa-solid fa-trash"></i>  
  
            Remove  
  
        </button>  
  
    </div>  
  
</div>  
  
<!-- ==========================  
REPLY PREVIEW  
========================== -->  
  
<div  
id="replyPreview"  
class="reply-preview"  
style="display:none;">  
  
    <div class="reply-info">  
  
        <small>Replying to</small>  
  
        <p id="replyText"></p>  
  
    </div>  
  
    <button  
    type="button"  
    onclick="cancelReply()">  
  
        <i class="fa-solid fa-xmark"></i>  
  
    </button>  
  
</div>  
  
<!-- ==========================  
MESSAGE BAR  
========================== -->  
  
<!-- ==========================
     2CHAT MESSAGE COMPOSER
========================== -->

<div class="message-composer">

    <!-- IMAGE BUTTON -->
    <label for="image" class="composer-btn image-btn">
        <i class="fa-solid fa-image"></i>
    </label>

    <input
        type="file"
        id="image"
        accept="image/*"
        hidden
    >

    <!-- MESSAGE INPUT -->
    <textarea
        id="message"
        rows="1"
        placeholder="Type a message..."
    ></textarea>

    <!-- SINGLE ACTION BUTTON -->
    <button
        id="sendBtn"
        class="composer-btn action-btn"
        type="button"
        onclick="handleSendAction()"
    >
        <i
            id="sendIcon"
            class="fa-solid fa-microphone"
        ></i>
    </button>

</div>


<!-- ==========================
     VOICE RECORDING / PREVIEW
========================== -->

<div
    id="recordingBox"
    class="voice-composer"
    style="display:none;"
>

    <!-- CANCEL -->
    <button
        id="cancelVoiceBtn"
        class="voice-action cancel-voice"
        type="button"
        onclick="cancelRecording()"
    >
        <i class="fa-solid fa-xmark"></i>
    </button>


    <!-- VOICE CONTENT -->
    <div class="voice-content">

        <div class="voice-status">

            <span
                id="recordDot"
                class="record-dot"
            ></span>

            <span id="recordTime">
                00:00
            </span>

            <span
                id="recordText"
                class="record-text"
            >
                Recording...
            </span>

        </div>


        <!-- AUDIO PREVIEW -->
        <div
            id="voicePreviewBox"
            class="voice-preview"
            style="display:none;"
        >

            <button
                id="voicePlayBtn"
                type="button"
                class="preview-play"
                onclick="toggleVoicePreview()"
            >
                <i
                    id="voicePlayIcon"
                    class="fa-solid fa-play"
                ></i>
            </button>

            <div class="preview-wave">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>

        <audio
            id="voicePreview"
            preload="metadata"
        ></audio>

    </div>


    <!-- STOP / SEND -->
    <button
        id="voiceActionBtn"
        class="voice-action send-voice"
        type="button"
        onclick="handleVoiceAction()"
    >
        <i
            id="voiceActionIcon"
            class="fa-solid fa-stop"
        ></i>
    </button>

</div>
  
  <!-- ==========================  
REACTION POPUP  
========================== -->  
  
<div  
id="reactionPopup"  
class="reaction-popup"  
style="display:none;">  
  
    <span onclick="selectReaction('❤️')">❤️</span>  
  
    <span onclick="selectReaction('👍')">👍</span>  
  
    <span onclick="selectReaction('😂')">😂</span>  
  
    <span onclick="selectReaction('😮')">😮</span>  
  
    <span onclick="selectReaction('😢')">😢</span>  
  
    <span onclick="selectReaction('😡')">😡</span>  
  
</div>  
  
<!-- ==========================  
IMAGE VIEWER  
========================== -->  
  
<div  
id="imageViewer"  
class="image-viewer"  
style="display:none;">  
  
    <button  
    class="close-image"  
    type="button"  
    onclick="closeImage()">  
  
        <i class="fa-solid fa-xmark"></i>  
  
    </button>  
  
    <img  
    id="fullImage"  
    src=""  
    alt="Image Preview">  
  
</div>  
  
<!-- ==========================  
SCRIPTS  
========================== -->  
  
<script src="/socket.io/socket.io.js"></script>  
  
<script src="/js/chat.js"></script>  
  
</body>  
  
</html>
