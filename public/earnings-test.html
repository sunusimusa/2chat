<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>2Chat Creator Earnings</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f5f5f5;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

        }


        .box {

            width: 100%;

            max-width: 460px;

            background: white;

            padding: 25px;

            border-radius: 18px;

            box-shadow:
                0 5px 25px
                rgba(0,0,0,.12);

        }


        h1 {

            margin-top: 0;

            text-align: center;

            font-size: 24px;

        }


        .earning-card {

            background: #fff3f8;

            border-radius: 15px;

            padding: 20px;

            margin-top: 20px;

        }


        .row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 15px 0;

            border-bottom:
                1px solid #eee;

        }


        .row:last-child {

            border-bottom: none;

        }


        .label {

            color: #666;

        }


        .value {

            font-size: 20px;

            font-weight: bold;

            color: #ff0874;

        }


        .available {

            background: #eafff0;

            margin:
                15px -5px;

            padding:
                15px 10px;

            border-radius: 12px;

        }


        .available .value {

            color: #159447;

            font-size: 24px;

        }


        .commission .value {

            color: #d35400;

        }


        button {

            width: 100%;

            padding: 13px;

            margin-top: 20px;

            border: none;

            border-radius: 10px;

            background: #ff0874;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        button:disabled {

            opacity: .6;

        }


        #message {

            text-align: center;

            margin-top: 15px;

            color: #555;

            min-height: 20px;

        }


        #result {

            margin-top: 15px;

            padding: 12px;

            background: #f5f5f5;

            border-radius: 10px;

            white-space: pre-wrap;

            word-break: break-word;

            font-size: 13px;

            display: none;

        }

    </style>

</head>


<body>


<div class="box">

    <h1>
        💰 Creator Earnings
    </h1>


    <div class="earning-card">


        <!-- GROSS EARNINGS -->

        <div class="row">

            <span class="label">
                Total Earned
            </span>

            <span
                id="totalEarned"
                class="value">

                ₦0.00

            </span>

        </div>


        <!-- PLATFORM COMMISSION -->

        <div class="row commission">

            <span class="label">
                Platform Commission
            </span>

            <span
                id="platformCommission"
                class="value">

                ₦0.00

            </span>

        </div>


        <!-- AVAILABLE BALANCE -->

        <div class="row available">

            <span class="label">
                Available Balance
            </span>

            <span
                id="availableBalance"
                class="value">

                ₦0.00

            </span>

        </div>


        <!-- TOTAL WITHDRAWN -->

        <div class="row">

            <span class="label">
                Total Withdrawn
            </span>

            <span
                id="totalWithdrawn"
                class="value">

                ₦0.00

            </span>

        </div>


        <!-- GIFTS RECEIVED -->

        <div class="row">

            <span class="label">
                Gifts Received
            </span>

            <span
                id="giftsReceived"
                class="value">

                0

            </span>

        </div>


    </div>


    <button
        id="loadBtn"
        onclick="loadEarnings()">

        🔄 Load Earnings

    </button>


    <p id="message">
        Ready to test...
    </p>


    <div id="result"></div>


</div>


<script>


/* =================================
   FORMAT NAIRA
================================= */

function formatNaira(amount) {

    return "₦" +
        Number(amount || 0)
            .toLocaleString(
                "en-NG",
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            );

}


/* =================================
   LOAD CREATOR EARNINGS
================================= */

async function loadEarnings() {


    const token =
        localStorage.getItem("token");


    /* ===============================
       CHECK LOGIN
    =============================== */

    if (!token) {

        document.getElementById(
            "message"
        ).innerText =
            "❌ Login token not found. Please login first.";

        return;

    }


    const button =
        document.getElementById(
            "loadBtn"
        );


    const message =
        document.getElementById(
            "message"
        );


    const resultBox =
        document.getElementById(
            "result"
        );


    button.disabled = true;

    button.innerText =
        "Loading...";


    message.innerText =
        "Connecting to wallet API...";


    resultBox.style.display =
        "none";


    try {


        /* =========================
           CALL API
        ========================= */

        const res =
            await fetch(
                "/api/wallet/earnings",
                {

                    method: "GET",

                    headers: {

                        "Authorization":
                            "Bearer " + token

                    }

                }
            );


        const data =
            await res.json();


        console.log(
            "EARNINGS API:",
            data
        );


        /* =========================
           SUCCESS
        ========================= */

        if (data.success) {


            const earnings =
                data.earnings || {};


            const totalEarned =
                earnings.totalEarned || 0;


            const platformCommission =
                earnings.platformCommission || 0;


            const availableBalance =
                earnings.availableBalance || 0;


            const totalWithdrawn =
                earnings.totalWithdrawn || 0;


            const giftsReceived =
                earnings.giftsReceived || 0;


            /* =====================
               DISPLAY
            ===================== */

            document.getElementById(
                "totalEarned"
            ).innerText =
                formatNaira(
                    totalEarned
                );


            document.getElementById(
                "platformCommission"
            ).innerText =
                formatNaira(
                    platformCommission
                );


            document.getElementById(
                "availableBalance"
            ).innerText =
                formatNaira(
                    availableBalance
                );


            document.getElementById(
                "totalWithdrawn"
            ).innerText =
                formatNaira(
                    totalWithdrawn
                );


            document.getElementById(
                "giftsReceived"
            ).innerText =
                giftsReceived;


            message.innerText =
                "✅ Earnings loaded successfully";


            /* =====================
               RAW API RESPONSE
            ===================== */

            resultBox.innerText =
                JSON.stringify(
                    data,
                    null,
                    2
                );


            resultBox.style.display =
                "block";


        } else {


            message.innerText =
                "❌ " +
                (
                    data.message ||
                    "Failed to load earnings"
                );


            resultBox.innerText =
                JSON.stringify(
                    data,
                    null,
                    2
                );


            resultBox.style.display =
                "block";

        }


    } catch (err) {


        console.error(
            "EARNINGS ERROR:",
            err
        );


        message.innerText =
            "❌ Server connection error";


        resultBox.innerText =
            err.message;


        resultBox.style.display =
            "block";


    }


    button.disabled = false;

    button.innerText =
        "🔄 Load Earnings";

}


/* =================================
   AUTO LOAD
================================= */

loadEarnings();


</script>


</body>

</html>
