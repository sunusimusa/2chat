<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>2Chat Admin Setup</title>

<style>

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    background: #f4f6f9;
}

.box {

    width: 100%;
    max-width: 400px;

    background: white;

    padding: 25px;

    border-radius: 18px;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.10);

}

h2 {
    margin-top: 0;
    text-align: center;
}

p {
    color: #666;
    text-align: center;
}

input {

    width: 100%;

    padding: 13px;

    margin-top: 10px;

    border: 1px solid #ddd;

    border-radius: 10px;

    box-sizing: border-box;

}

button {

    width: 100%;

    padding: 14px;

    margin-top: 15px;

    border: none;

    border-radius: 10px;

    background: #ff0874;

    color: white;

    font-weight: bold;

    cursor: pointer;

}

button:disabled {

    opacity: .6;

}

#message {

    margin-top: 15px;

    font-weight: bold;

}

</style>

</head>


<body>


<div class="box">

    <h2>🛡️ 2Chat Admin Setup</h2>

    <p>
        Promote an existing 2Chat account to admin.
    </p>


    <input
        id="username"
        type="text"
        placeholder="Username"
        value="2chat"
    >


    <input
        id="secret"
        type="password"
        placeholder="Admin Setup Secret"
    >


    <button
        id="setupButton"
        onclick="setupAdmin()"
    >
        🔐 Make Admin
    </button>


    <div id="message"></div>

</div>


<script>

async function setupAdmin() {

    const username =
        document
        .getElementById("username")
        .value
        .trim();


    const secret =
        document
        .getElementById("secret")
        .value;


    const message =
        document
        .getElementById("message");


    const button =
        document
        .getElementById("setupButton");


    if (!username || !secret) {

        message.innerText =
            "❌ Enter username and secret.";

        return;

    }


    button.disabled = true;

    button.innerText =
        "🔄 Setting up...";

    message.innerText = "";


    try {

        const response =
            await fetch(
                "/api/admin/setup",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            username,
                            secret

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            message.innerText =
                "❌ " +
                (
                    data.message ||
                    "Admin setup failed."
                );

            return;

        }


        message.innerText =
            "✅ " +
            data.message +
            " Role: " +
            data.user.role;


    } catch (error) {

        console.error(
            "ADMIN SETUP ERROR:",
            error
        );

        message.innerText =
            "❌ Connection error.";

    }


    button.disabled = false;

    button.innerText =
        "🔐 Make Admin";

}

</script>

</body>

  </html>
