<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>2Chat - Payment</title>

    <link
        rel="stylesheet"
        href="/css/coinPayment.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    >

</head>


<body>


<header class="payment-header">

    <button
        class="back-btn"
        onclick="goBack()"
        type="button"
    >

        <i class="fa-solid fa-arrow-left"></i>

    </button>


    <div class="header-title">

        <i class="fa-solid fa-credit-card"></i>

        <h1>
            Payment
        </h1>

    </div>

</header>



<main class="payment-page">


    <!-- =========================================
         LOADING
    ========================================== -->

    <div
        id="loading"
        class="message"
    >

        <i class="fa-solid fa-spinner fa-spin"></i>

        Preparing payment...

    </div>



    <!-- =========================================
         ERROR
    ========================================== -->

    <div
        id="errorMessage"
        class="message error"
        style="display:none;"
    ></div>



    <!-- =========================================
         PAYMENT CONTENT
    ========================================== -->

    <section
        id="paymentContent"
        style="display:none;"
    >


        <!-- =====================================
             PURCHASE
        ====================================== -->

        <section class="payment-card">

            <div class="payment-icon">

                <i class="fa-solid fa-coins"></i>

            </div>


            <h2>
                Confirm Payment
            </h2>


            <div
                id="purchaseInfo"
                class="purchase-info"
            ></div>

        </section>



        <!-- =====================================
             PAYSTACK PAYMENT
        ====================================== -->

        <section class="payment-card">

            <h3>

                <i class="fa-solid fa-shield-halved"></i>

                Secure Payment

            </h3>


            <div
                class="payment-message"
                id="paymentMessage"
            >

                You will be redirected to Paystack
                to complete your payment securely.

            </div>


            <!-- =================================
                 PAY BUTTON
            ================================== -->

            <button
                id="continuePaymentButton"
                class="continue-btn"
                type="button"
            >

                <i class="fa-solid fa-lock"></i>

                Pay Now

            </button>


            <!-- =================================
                 CHECK PAYMENT
            ================================== -->

            <button
                id="checkPaymentButton"
                class="continue-btn"
                type="button"
                style="display:none;"
            >

                <i class="fa-solid fa-rotate"></i>

                Check Payment

            </button>


            <!-- =================================
                 SECURITY
            ================================== -->

            <p class="security-note">

                <i class="fa-solid fa-shield-halved"></i>

                Your payment is processed securely
                through Paystack.

            </p>


        </section>


    </section>


</main>



<script>

"use strict";


// =====================================================
// GLOBAL VARIABLES
// =====================================================

let purchaseId = null;

let packageId = null;

let purchase = null;

let processingPayment = false;


// =====================================================
// ELEMENTS
// =====================================================

const loading =
    document.getElementById(
        "loading"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );


const paymentContent =
    document.getElementById(
        "paymentContent"
    );


const purchaseInfo =
    document.getElementById(
        "purchaseInfo"
    );


const paymentMessage =
    document.getElementById(
        "paymentMessage"
    );


const continueButton =
    document.getElementById(
        "continuePaymentButton"
    );


const checkPaymentButton =
    document.getElementById(
        "checkPaymentButton"
    );


// =====================================================
// GO BACK
// =====================================================

function goBack() {

    if (
        window.history.length > 1
    ) {

        window.history.back();

    } else {

        window.location.href =
            "/wallet.html";

    }

}


// =====================================================
// GET TOKEN
// =====================================================

function getToken() {

    const token =
        localStorage.getItem(
            "token"
        );


    if (!token) {

        throw new Error(
            "Please login first."
        );

    }


    return token;

}


// =====================================================
// GET URL PARAMETER
// =====================================================

function getUrlParameter(
    name
) {

    const params =
        new URLSearchParams(
            window.location.search
        );


    return params.get(
        name
    );

}


// =====================================================
// GET PURCHASE ID
// =====================================================

function getPurchaseId() {

    return (

        getUrlParameter(
            "purchaseId"
        )

        ||

        getUrlParameter(
            "purchase"
        )

        ||

        getUrlParameter(
            "id"
        )

        ||

        localStorage.getItem(
            "coinPurchaseId"
        )

    );

}


// =====================================================
// GET PACKAGE ID
// =====================================================

function getPackageId() {

    return (

        getUrlParameter(
            "packageId"
        )

        ||

        getUrlParameter(
            "package"
        )

        ||

        localStorage.getItem(
            "selectedCoinPackageId"
        )

        ||

        localStorage.getItem(
            "coinPackageId"
        )

        ||

        localStorage.getItem(
            "packageId"
        )

    );

}


// =====================================================
// CREATE PURCHASE
// =====================================================

async function createPurchase() {

    const token =
        getToken();


    packageId =
        getPackageId();


    if (!packageId) {

        throw new Error(

            "Coin package ID is missing. Please select a coin package again."

        );

    }


    paymentMessage.innerText =
        "Creating your payment order...";


    const response =
        await fetch(

            "/api/coin-purchases",

            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "application/json",

                    "Authorization":
                        `Bearer ${token}`

                },

                body:
                    JSON.stringify({

                        packageId:
                            packageId

                    })

            }

        );


    const data =
        await response.json();


    if (
        !response.ok ||
        !data.success
    ) {

        throw new Error(

            data.message ||
            "Unable to create coin purchase."

        );

    }


    if (
        !data.purchase ||
        !data.purchase.id
    ) {

        throw new Error(
            "Purchase was created but purchase ID was not returned."
        );

    }


    purchaseId =
        data.purchase.id;


    purchase =
        data.purchase;


    localStorage.setItem(
        "coinPurchaseId",
        String(
            purchaseId
        )
    );


    return purchase;

}


// =====================================================
// LOAD PURCHASE
// =====================================================

async function loadPurchase() {

    try {

        const token =
            getToken();


        purchaseId =
            getPurchaseId();


        // =============================================
        // CREATE PURCHASE IF NEEDED
        // =============================================

        if (!purchaseId) {

            packageId =
                getPackageId();


            if (!packageId) {

                throw new Error(

                    "Please select a coin package before continuing to payment."

                );

            }


            purchase =
                await createPurchase();

        }


        // =============================================
        // LOAD EXISTING PURCHASE
        // =============================================

        if (!purchase) {

            const response =
                await fetch(

                    `/api/coin-purchases/${encodeURIComponent(
                        purchaseId
                    )}`,

                    {

                        method:
                            "GET",

                        headers: {

                            "Authorization":
                                `Bearer ${token}`

                        }

                    }

                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(

                    data.message ||
                    "Unable to load purchase."

                );

            }


            purchase =
                data.purchase;


            if (!purchase) {

                throw new Error(
                    "Purchase information was not returned."
                );

            }

        }


        // =============================================
        // SAVE PURCHASE ID
        // =============================================

        purchaseId =
            purchase.id ||
            purchase._id ||
            purchaseId;


        if (purchaseId) {

            localStorage.setItem(
                "coinPurchaseId",
                String(
                    purchaseId
                )
            );

        }


        // =============================================
        // CHECK STATUS
        // =============================================

        if (
            purchase.status ===
            "paid"
        ) {

            renderPurchase();

            loading.style.display =
                "none";

            paymentContent.style.display =
                "block";

            paymentMessage.innerText =
                "✅ This payment has already been completed.";

            continueButton.style.display =
                "none";

            checkPaymentButton.style.display =
                "none";

            return;

        }


        if (
            purchase.status !==
            "pending"
        ) {

            paymentMessage.innerText =
                `This purchase is already ${purchase.status}.`;

            continueButton.disabled =
                true;

        }


        // =============================================
        // RENDER
        // =============================================

        renderPurchase();


        loading.style.display =
            "none";


        paymentContent.style.display =
            "block";


        if (
            purchase.status ===
            "pending"
        ) {

            paymentMessage.innerText =
                "You will be redirected to Paystack to complete your payment securely.";

        }


    } catch (error) {

        console.error(
            "LOAD PURCHASE ERROR:",
            error
        );


        showError(

            error.message ||
            "Unable to prepare payment."

        );

    }

}


// =====================================================
// RENDER PURCHASE
// =====================================================

function renderPurchase() {

    const coins =
        Number(
            purchase.coins || 0
        );


    const amount =
        Number(
            purchase.amount || 0
        );


    const currency =
        purchase.currency ||
        "NGN";


    const reference =
        purchase.reference ||
        "";


    const status =
        purchase.status ||
        "pending";


    purchaseInfo.innerHTML = `

        <div class="purchase-row">

            <span>
                Coins
            </span>

            <strong>
                ${formatNumber(coins)}
            </strong>

        </div>


        <div class="purchase-row">

            <span>
                Amount
            </span>

            <strong>
                ${currencySymbol(currency)}
                ${formatNumber(amount)}
            </strong>

        </div>


        <div class="purchase-row">

            <span>
                Reference
            </span>

            <small>
                ${escapeHtml(reference)}
            </small>

        </div>


        <div class="purchase-row">

            <span>
                Status
            </span>

            <strong class="pending">

                ${escapeHtml(status)}

            </strong>

        </div>

    `;

}


// =====================================================
// INITIALIZE PAYSTACK PAYMENT
// =====================================================

async function initializePaystackPayment() {

    const token =
        getToken();


    if (!purchaseId) {

        throw new Error(
            "Purchase ID is missing."
        );

    }


    paymentMessage.innerText =
        "Connecting securely to Paystack...";


    const response =
        await fetch(

            `/api/coin-purchases/${encodeURIComponent(
                purchaseId
            )}/initialize-payment`,

            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "application/json",

                    "Authorization":
                        `Bearer ${token}`

                }

            }

        );


    const data =
        await response.json();


    if (
        !response.ok ||
        !data.success
    ) {

        throw new Error(

            data.message ||
            "Unable to initialize Paystack payment."

        );

    }


    /*
     * Our backend should return:
     *
     * data.payment.authorization_url
     *
     * or directly:
     *
     * data.authorization_url
     *
     */

    const payment =
        data.payment ||
        data;


    const authorizationUrl =
        payment.authorization_url;


    if (!authorizationUrl) {

        throw new Error(
            "Paystack did not return an authorization URL."
        );

    }


    paymentMessage.innerText =
        "Opening secure Paystack payment...";


    // =============================================
    // REDIRECT TO PAYSTACK
    // =============================================

    window.location.href =
        authorizationUrl;

}


// =====================================================
// PAY BUTTON
// =====================================================

continueButton.addEventListener(
    "click",
    async function () {

        if (processingPayment) {

            return;

        }


        try {

            processingPayment =
                true;


            continueButton.disabled =
                true;


            continueButton.innerHTML = `

                <i class="fa-solid fa-spinner fa-spin"></i>

                Opening Paystack...

            `;


            await initializePaystackPayment();


        } catch (error) {

            console.error(
                "PAYMENT ERROR:",
                error
            );


            showError(

                error.message ||
                "Unable to start payment."

            );


            processingPayment =
                false;


            continueButton.disabled =
                false;


            continueButton.innerHTML = `

                <i class="fa-solid fa-lock"></i>

                Pay Now

            `;

        }

    }
);


// =====================================================
// CHECK PAYMENT
// =====================================================

checkPaymentButton.addEventListener(
    "click",
    async function () {

        try {

            const token =
                getToken();


            if (!purchaseId) {

                throw new Error(
                    "Purchase ID is missing."
                );

            }


            checkPaymentButton.disabled =
                true;


            checkPaymentButton.innerHTML = `

                <i class="fa-solid fa-spinner fa-spin"></i>

                Checking...

            `;


            const response =
                await fetch(

                    `/api/coin-purchases/${encodeURIComponent(
                        purchaseId
                    )}`,

                    {

                        method:
                            "GET",

                        headers: {

                            "Authorization":
                                `Bearer ${token}`

                        }

                    }

                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(

                    data.message ||
                    "Unable to check payment."

                );

            }


            purchase =
                data.purchase;


            renderPurchase();


            if (
                purchase.status ===
                "paid"
            ) {

                paymentMessage.innerText =
                    "✅ Payment confirmed. Your coins have been credited.";

                continueButton.style.display =
                    "none";

                checkPaymentButton.style.display =
                    "none";

                return;

            }


            paymentMessage.innerText =
                "Payment has not been confirmed yet. If you just paid, please wait a moment and check again.";


            checkPaymentButton.disabled =
                false;


            checkPaymentButton.innerHTML = `

                <i class="fa-solid fa-rotate"></i>

                Check Payment

            `;


        } catch (error) {

            console.error(
                "CHECK PAYMENT ERROR:",
                error
            );


            paymentMessage.innerText =
                error.message ||
                "Unable to check payment.";


            checkPaymentButton.disabled =
                false;


            checkPaymentButton.innerHTML = `

                <i class="fa-solid fa-rotate"></i>

                Check Payment

            `;

        }

    }
);


// =====================================================
// SHOW ERROR
// =====================================================

function showError(
    message
) {

    loading.style.display =
        "none";


    paymentContent.style.display =
        "none";


    errorMessage.style.display =
        "block";


    errorMessage.innerHTML = `

        <i class="fa-solid fa-circle-exclamation"></i>

        ${escapeHtml(message)}

        <br><br>

        <button
            onclick="goBack()"
            class="back-error-btn"
            type="button"
        >

            Go Back

        </button>

    `;

}


// =====================================================
// FORMAT NUMBER
// =====================================================

function formatNumber(
    value
) {

    return Number(
        value || 0
    ).toLocaleString(
        "en-NG"
    );

}


// =====================================================
// CURRENCY SYMBOL
// =====================================================

function currencySymbol(
    currency
) {

    if (
        String(currency)
            .toUpperCase() ===
        "NGN"
    ) {

        return "₦";

    }


    return (

        String(currency)
            .toUpperCase() +
        " "

    );

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(
    value
) {

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


// =====================================================
// START
// =====================================================

loadPurchase();

</script>


</body>

</html>
