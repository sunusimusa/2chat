<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>2Chat - Payment</title>

    <link
        rel="stylesheet"
        href="/css/coinPayment.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    >

</head>

<body>


<header class="payment-header">

    <button
        class="back-btn"
        onclick="goBack()"
        type="button"
    >

        <i class="fa-solid fa-arrow-left"></i>

    </button>


    <div class="header-title">

        <i class="fa-solid fa-credit-card"></i>

        <h1>
            Payment
        </h1>

    </div>

</header>



<main class="payment-page">


    <!-- =========================================
         LOADING
    ========================================== -->

    <div
        id="loading"
        class="message"
    >

        <i class="fa-solid fa-spinner fa-spin"></i>

        Preparing payment...

    </div>



    <!-- =========================================
         ERROR
    ========================================== -->

    <div
        id="errorMessage"
        class="message error"
        style="display:none;"
    ></div>



    <!-- =========================================
         PAYMENT CONTENT
    ========================================== -->

    <section
        id="paymentContent"
        style="display:none;"
    >


        <!-- =====================================
             PURCHASE
        ====================================== -->

        <section class="payment-card">

            <div class="payment-icon">

                <i class="fa-solid fa-coins"></i>

            </div>


            <h2>
                Confirm Payment
            </h2>


            <div
                id="purchaseInfo"
                class="purchase-info"
            ></div>

        </section>



        <!-- =====================================
             PAYMENT METHOD
        ====================================== -->

        <section class="payment-card">

            <h3>

                <i class="fa-solid fa-credit-card"></i>

                Card Payment

            </h3>


            <!-- =================================
                 CARD NUMBER
            ================================== -->

            <div class="form-group">

                <label for="cardNumber">

                    Card Number

                </label>


                <div class="input-wrapper">

                    <i class="fa-solid fa-credit-card"></i>

                    <input
                        id="cardNumber"
                        type="text"
                        inputmode="numeric"
                        autocomplete="cc-number"
                        maxlength="19"
                        placeholder="1234 5678 9012 3456"
                    >

                </div>

            </div>



            <!-- =================================
                 EXPIRY + CVV
            ================================== -->

            <div class="card-row">


                <div class="form-group">

                    <label for="expiryMonth">

                        Expiry Month

                    </label>


                    <input
                        id="expiryMonth"
                        type="text"
                        inputmode="numeric"
                        autocomplete="cc-exp-month"
                        maxlength="2"
                        placeholder="MM"
                    >

                </div>



                <div class="form-group">

                    <label for="expiryYear">

                        Expiry Year

                    </label>


                    <input
                        id="expiryYear"
                        type="text"
                        inputmode="numeric"
                        autocomplete="cc-exp-year"
                        maxlength="4"
                        placeholder="YYYY"
                    >

                </div>



                <div class="form-group">

                    <label for="cvv">

                        CVV

                    </label>


                    <input
                        id="cvv"
                        type="password"
                        inputmode="numeric"
                        autocomplete="cc-csc"
                        maxlength="4"
                        placeholder="CVV"
                    >

                </div>


            </div>



            <!-- =================================
                 PAYMENT MESSAGE
            ================================== -->

            <div
                id="paymentMessage"
                class="payment-message"
            >

                Enter your card details to continue.

            </div>



            <!-- =================================
                 PAY BUTTON
            ================================== -->

            <button
                id="continuePaymentButton"
                class="continue-btn"
                type="button"
            >

                <i class="fa-solid fa-lock"></i>

                Pay Now

            </button>



            <!-- =================================
                 SECURITY
            ================================== -->

            <p class="security-note">

                <i class="fa-solid fa-shield-halved"></i>

                Your payment is processed securely
                through Flutterwave.

            </p>


        </section>


    </section>


</main>



<script>

"use strict";


// =====================================================
// GLOBAL VARIABLES
// =====================================================

let purchaseId = null;

let packageId = null;

let purchase = null;

let processingPayment = false;


// =====================================================
// ELEMENTS
// =====================================================

const loading =
    document.getElementById(
        "loading"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );


const paymentContent =
    document.getElementById(
        "paymentContent"
    );


const purchaseInfo =
    document.getElementById(
        "purchaseInfo"
    );


const paymentMessage =
    document.getElementById(
        "paymentMessage"
    );


const continueButton =
    document.getElementById(
        "continuePaymentButton"
    );


const cardNumberInput =
    document.getElementById(
        "cardNumber"
    );


const expiryMonthInput =
    document.getElementById(
        "expiryMonth"
    );


const expiryYearInput =
    document.getElementById(
        "expiryYear"
    );


const cvvInput =
    document.getElementById(
        "cvv"
    );


// =====================================================
// GO BACK
// =====================================================

function goBack() {

    if (
        window.history.length > 1
    ) {

        window.history.back();

    } else {

        window.location.href =
            "/wallet.html";

    }

}


// =====================================================
// GET TOKEN
// =====================================================

function getToken() {

    const token =
        localStorage.getItem(
            "token"
        );


    if (!token) {

        throw new Error(
            "Please login first."
        );

    }


    return token;

}


// =====================================================
// GET URL PARAMETER
// =====================================================

function getUrlParameter(
    name
) {

    const params =
        new URLSearchParams(
            window.location.search
        );


    return params.get(
        name
    );

}


// =====================================================
// GET PURCHASE ID
// =====================================================

function getPurchaseId() {

    return (

        getUrlParameter(
            "purchaseId"
        )

        ||

        getUrlParameter(
            "purchase"
        )

        ||

        getUrlParameter(
            "id"
        )

        ||

        localStorage.getItem(
            "coinPurchaseId"
        )

    );

}


// =====================================================
// GET PACKAGE ID
// =====================================================

function getPackageId() {

    return (

        getUrlParameter(
            "packageId"
        )

        ||

        getUrlParameter(
            "package"
        )

        ||

        localStorage.getItem(
            "selectedCoinPackageId"
        )

        ||

        localStorage.getItem(
            "coinPackageId"
        )

        ||

        localStorage.getItem(
            "packageId"
        )

    );

}


// =====================================================
// CREATE PURCHASE
// =====================================================

async function createPurchase() {

    const token =
        getToken();


    packageId =
        getPackageId();


    if (!packageId) {

        throw new Error(

            "Coin package ID is missing. Please select a coin package again."

        );

    }


    paymentMessage.innerText =
        "Creating your payment order...";


    const response =
        await fetch(

            "/api/coin-purchases",

            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "application/json",

                    "Authorization":
                        `Bearer ${token}`

                },

                body:
                    JSON.stringify({

                        packageId:
                            packageId

                    })

            }

        );


    const data =
        await response.json();


    if (
        !response.ok ||
        !data.success
    ) {

        throw new Error(

            data.message ||
            "Unable to create coin purchase."

        );

    }


    if (
        !data.purchase ||
        !data.purchase.id
    ) {

        throw new Error(
            "Purchase was created but purchase ID was not returned."
        );

    }


    purchaseId =
        data.purchase.id;


    purchase =
        data.purchase;


    localStorage.setItem(
        "coinPurchaseId",
        String(
            purchaseId
        )
    );


    return purchase;

}


// =====================================================
// LOAD PURCHASE
// =====================================================

async function loadPurchase() {

    try {

        const token =
            getToken();


        purchaseId =
            getPurchaseId();


        // =============================================
        // CREATE PURCHASE IF NEEDED
        // =============================================

        if (!purchaseId) {

            packageId =
                getPackageId();


            if (!packageId) {

                throw new Error(

                    "Please select a coin package before continuing to payment."

                );

            }


            purchase =
                await createPurchase();

        }


        // =============================================
        // LOAD EXISTING PURCHASE
        // =============================================

        if (!purchase) {

            const response =
                await fetch(

                    `/api/coin-purchases/${encodeURIComponent(
                        purchaseId
                    )}`,

                    {

                        method:
                            "GET",

                        headers: {

                            "Authorization":
                                `Bearer ${token}`

                        }

                    }

                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(

                    data.message ||
                    "Unable to load purchase."

                );

            }


            purchase =
                data.purchase;


            if (!purchase) {

                throw new Error(
                    "Purchase information was not returned."
                );

            }

        }


        // =============================================
        // SAVE ID
        // =============================================

        purchaseId =
            purchase.id ||
            purchase._id ||
            purchaseId;


        if (purchaseId) {

            localStorage.setItem(
                "coinPurchaseId",
                String(
                    purchaseId
                )
            );

        }


        // =============================================
        // CHECK STATUS
        // =============================================

        if (
            purchase.status !==
            "pending"
        ) {

            paymentMessage.innerText =
                `This purchase is already ${purchase.status}.`;

            continueButton.disabled =
                true;

        }


        // =============================================
        // RENDER
        // =============================================

        renderPurchase();


        loading.style.display =
            "none";


        paymentContent.style.display =
            "block";


        if (
            purchase.status ===
            "pending"
        ) {

            paymentMessage.innerText =
                "Enter your card details to continue.";

        }


    } catch (error) {

        console.error(
            "LOAD PURCHASE ERROR:",
            error
        );


        showError(

            error.message ||
            "Unable to prepare payment."

        );

    }

}


// =====================================================
// RENDER PURCHASE
// =====================================================

function renderPurchase() {

    const coins =
        Number(
            purchase.coins || 0
        );


    const amount =
        Number(
            purchase.amount || 0
        );


    const currency =
        purchase.currency ||
        "NGN";


    const reference =
        purchase.reference ||
        "";


    const status =
        purchase.status ||
        "pending";


    purchaseInfo.innerHTML = `

        <div class="purchase-row">

            <span>
                Coins
            </span>

            <strong>
                ${formatNumber(coins)}
            </strong>

        </div>


        <div class="purchase-row">

            <span>
                Amount
            </span>

            <strong>
                ${currencySymbol(currency)}
                ${formatNumber(amount)}
            </strong>

        </div>


        <div class="purchase-row">

            <span>
                Reference
            </span>

            <small>
                ${escapeHtml(reference)}
            </small>

        </div>


        <div class="purchase-row">

            <span>
                Status
            </span>

            <strong class="pending">

                ${escapeHtml(status)}

            </strong>

        </div>

    `;

}


// =====================================================
// CLEAN CARD NUMBER
// =====================================================

function getCleanCardNumber() {

    return String(
        cardNumberInput.value ||
        ""
    )
    .replace(
        /\s+/g,
        ""
    )
    .trim();

}


// =====================================================
// VALIDATE CARD
// =====================================================

function validateCard() {

    const cardNumber =
        getCleanCardNumber();


    const expiryMonth =
        String(
            expiryMonthInput.value ||
            ""
        ).trim();


    const expiryYear =
        String(
            expiryYearInput.value ||
            ""
        ).trim();


    const cvv =
        String(
            cvvInput.value ||
            ""
        ).trim();


    if (
        !/^\d{12,19}$/.test(
            cardNumber
        )
    ) {

        throw new Error(
            "Please enter a valid card number."
        );

    }


    if (
        !/^\d{1,2}$/.test(
            expiryMonth
        )
    ) {

        throw new Error(
            "Please enter a valid expiry month."
        );

    }


    const month =
        Number(
            expiryMonth
        );


    if (
        month < 1 ||
        month > 12
    ) {

        throw new Error(
            "Expiry month must be between 01 and 12."
        );

    }


    if (
        !/^\d{2,4}$/.test(
            expiryYear
        )
    ) {

        throw new Error(
            "Please enter a valid expiry year."
        );

    }


    if (
        !/^\d{3,4}$/.test(
            cvv
        )
    ) {

        throw new Error(
            "Please enter a valid CVV."
        );

    }


    return {

        number:
            cardNumber,

        expiryMonth:
            expiryMonth.padStart(
                2,
                "0"
            ),

        expiryYear,

        cvv

    };

}


// =====================================================
// CREATE PAYMENT METHOD
// =====================================================

async function createPaymentMethod() {

    const token =
        getToken();


    const card =
        validateCard();


    paymentMessage.innerText =
        "Securing your card information...";


    const response =
        await fetch(

            `/api/coin-purchases/${encodeURIComponent(
                purchaseId
            )}/payment-method`,

            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "application/json",

                    "Authorization":
                        `Bearer ${token}`

                },

                body:
                    JSON.stringify({

                        card

                    })

            }

        );


    const data =
        await response.json();


    if (
        !response.ok ||
        !data.success
    ) {

        throw new Error(

            data.message ||
            "Failed to create Flutterwave payment method."

        );

    }


    if (
        !data.paymentMethod ||
        !data.paymentMethod.id
    ) {

        throw new Error(
            "Flutterwave payment method ID was not returned."
        );

    }


    return data.paymentMethod;

}


// =====================================================
// INITIALIZE PAYMENT
// =====================================================

async function initializePayment(
    paymentMethodId
) {

    const token =
        getToken();


    if (!paymentMethodId) {

        throw new Error(
            "Payment method ID is missing."
        );

    }


    paymentMessage.innerText =
        "Preparing Flutterwave payment...";


    const response =
        await fetch(

            `/api/coin-purchases/${encodeURIComponent(
                purchaseId
            )}/initialize-payment`,

            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "application/json",

                    "Authorization":
                        `Bearer ${token}`

                },

                body:
                    JSON.stringify({

                        paymentMethodId

                    })

            }

        );


    const data =
        await response.json();


    if (
        !response.ok ||
        !data.success
    ) {

        throw new Error(

            data.message ||
            "Failed to initialize Flutterwave payment."

        );

    }


    if (!data.payment) {

        throw new Error(
            "Flutterwave payment response is missing."
        );

    }


    return data.payment;

}


// =====================================================
// OPEN FLUTTERWAVE AUTHORIZATION
// =====================================================

function openFlutterwaveAuthorization(
    payment
) {

    const checkoutUrl =
        payment.checkoutUrl ||
        payment.paymentUrl ||
        payment.link;


    // =============================================
    // REDIRECT AUTHORIZATION
    // =============================================

    if (checkoutUrl) {

        paymentMessage.innerText =
            "Opening Flutterwave authorization...";


        window.location.href =
            checkoutUrl;


        return true;

    }


    // =============================================
    // NEXT ACTION REDIRECT
    // =============================================

    const nextAction =
        payment.nextAction;


    if (
        nextAction &&
        nextAction.type ===
        "redirect_url"
    ) {

        const redirectUrl =
            nextAction
                ?.redirect_url
                ?.url;


        if (redirectUrl) {

            paymentMessage.innerText =
                "Opening Flutterwave authorization...";


            window.location.href =
                redirectUrl;


            return true;

        }

    }


    // =============================================
    // AUTHORIZATION REQUIRED
    // =============================================

    if (
        nextAction &&
        nextAction.type ===
        "authorize"
    ) {

        const authType =
            nextAction
                ?.authorization
                ?.type ||
            "authorization";


        paymentMessage.innerText =
            `Flutterwave requires ${authType} authorization. Please follow the authorization instructions.`;


        throw new Error(

            `Flutterwave requires ${authType} authorization. Please continue with the authorization step.`

        );

    }


    return false;

}


// =====================================================
// CONTINUE PAYMENT
// =====================================================

continueButton.addEventListener(
    "click",
    async function () {

        if (
            processingPayment
        ) {

            return;

        }


        try {

            processingPayment =
                true;


            continueButton.disabled =
                true;


            continueButton.innerHTML = `

                <i class="fa-solid fa-spinner fa-spin"></i>

                Processing...

            `;


            // =========================================
            // CHECK PURCHASE
            // =========================================

            if (!purchaseId) {

                throw new Error(
                    "Purchase order is not available."
                );

            }


            if (
                !purchase ||
                purchase.status !==
                "pending"
            ) {

                throw new Error(
                    "This purchase is no longer pending."
                );

            }


            // =========================================
            // CREATE PAYMENT METHOD
            // =========================================

            const paymentMethod =
                await createPaymentMethod();


            // =========================================
            // INITIALIZE CHARGE
            // =========================================

            const payment =
                await initializePayment(

                    paymentMethod.id

                );


            // =========================================
            // OPEN FLUTTERWAVE
            // =========================================

            const opened =
                openFlutterwaveAuthorization(
                    payment
                );


            if (!opened) {

                throw new Error(

                    "Flutterwave did not return an authorization URL."

                );

            }


        } catch (error) {

            console.error(
                "PAYMENT ERROR:",
                error
            );


            showError(

                error.message ||
                "Unable to start payment."

            );


            processingPayment =
                false;


            continueButton.disabled =
                false;


            continueButton.innerHTML = `

                <i class="fa-solid fa-lock"></i>

                Pay Now

            `;

        }

    }
);


// =====================================================
// CARD NUMBER FORMAT
// =====================================================

cardNumberInput.addEventListener(
    "input",
    function () {

        let value =
            this.value
                .replace(
                    /\D/g,
                    ""
                )
                .substring(
                    0,
                    19
                );


        const groups =
            value.match(
                /.{1,4}/g
            );


        this.value =
            groups
                ? groups.join(" ")
                : "";

    }
);


// =====================================================
// ONLY NUMBERS
// =====================================================

expiryMonthInput.addEventListener(
    "input",
    function () {

        this.value =
            this.value
                .replace(
                    /\D/g,
                    ""
                )
                .substring(
                    0,
                    2
                );

    }
);


expiryYearInput.addEventListener(
    "input",
    function () {

        this.value =
            this.value
                .replace(
                    /\D/g,
                    ""
                )
                .substring(
                    0,
                    4
                );

    }
);


cvvInput.addEventListener(
    "input",
    function () {

        this.value =
            this.value
                .replace(
                    /\D/g,
                    ""
                )
                .substring(
                    0,
                    4
                );

    }
);


// =====================================================
// SHOW ERROR
// =====================================================

function showError(
    message
) {

    loading.style.display =
        "none";


    paymentContent.style.display =
        "none";


    errorMessage.style.display =
        "block";


    errorMessage.innerHTML = `

        <i class="fa-solid fa-circle-exclamation"></i>

        ${escapeHtml(message)}

        <br><br>

        <button
            onclick="goBack()"
            class="back-error-btn"
            type="button"
        >

            Go Back

        </button>

    `;

}


// =====================================================
// FORMAT NUMBER
// =====================================================

function formatNumber(
    value
) {

    return Number(
        value || 0
    ).toLocaleString(
        "en-NG"
    );

}


// =====================================================
// CURRENCY SYMBOL
// =====================================================

function currencySymbol(
    currency
) {

    if (
        String(currency)
            .toUpperCase() ===
        "NGN"
    ) {

        return "₦";

    }


    return (

        String(currency)
            .toUpperCase() +
        " "

    );

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(
    value
) {

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


// =====================================================
// START
// =====================================================

loadPurchase();

</script>


</body>

</html>
