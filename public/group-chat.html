<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>2Chat Group Chat</title>

<link rel="stylesheet" href="/css/group-chat.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

</head>

<body>

<!-- HEADER -->

<header class="chat-header">

<button class="back-btn" onclick="history.back()">
<i class="fa-solid fa-arrow-left"></i>
</button>

<div class="group-info">

<img
id="groupAvatar"
src="/images/default-group.png"
alt="Group">

<div>

<h3 id="groupName">
Loading...
</h3>

<p id="groupMembers">
0 Members
</p>

</div>

</div>

<button id="groupInfoBtn">
<i class="fa-solid fa-circle-info"></i>
</button>

</header>

<!-- CHAT -->

<div
id="groupChat"
class="chat-container">

</div>

<!-- IMAGE PREVIEW -->

<div
id="previewBox"
class="preview-box">

<img
id="previewImage"
src="">

<button
onclick="removeImage()">

<i class="fa-solid fa-trash"></i>

Remove

</button>

</div>

<!-- MESSAGE BAR -->

<div class="message-bar">

<label
for="groupImage"
class="icon-btn">

<i class="fa-solid fa-image"></i>

</label>

<input
type="file"
id="groupImage"
accept="image/*"
hidden>

<textarea

id="message"

rows="1"

placeholder="Type a message...">

</textarea>

<button id="recordBtn">

<i class="fa-solid fa-microphone"></i>

</button>

<button id="sendBtn">

<i class="fa-solid fa-paper-plane"></i>

</button>

</div>

<script src="/socket.io/socket.io.js"></script>

<script src="/js/group-chat.js"></script>

</body>

</html>
