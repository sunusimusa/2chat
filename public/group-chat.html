<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>2Chat Group Chat</title>

<link rel="stylesheet" href="/css/group-chat.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

</head>

<body>

  <!-- ==========================
TELEGRAM IMAGE VIEWER
========================== -->

<div id="imageViewer" class="image-viewer">

    <span id="closeViewer">&times;</span>

    <img id="viewerImage">

</div>

<!-- HEADER -->

<header class="chat-header">

<button class="back-btn" onclick="history.back()">
<i class="fa-solid fa-arrow-left"></i>
</button>

<div class="group-info">

<img
id="groupAvatar"
src="/images/default-group.png"
alt="Group">

<div>

<h3 id="groupName">
Loading...
</h3>

<p id="groupMembers">
0 Members
</p>

</div>

</div>

<button id="groupInfoBtn">
<i class="fa-solid fa-circle-info"></i>
</button>

</header>

<!-- CHAT -->

<div
id="groupChat"
class="chat-container">

</div>

<!-- IMAGE PREVIEW -->

<div
id="previewBox"
class="preview-box">

<img
id="previewImage"
src="">

<button
onclick="removeImage()">

<i class="fa-solid fa-trash"></i>

Remove

</button>

</div>

<!-- MESSAGE BAR -->

  <!-- ==========================
VOICE PREVIEW
========================== -->

<div id="voicePreview" class="voice-preview">

    <audio id="voicePlayer" controls></audio>

    <button id="deleteVoice">

        <i class="fa-solid fa-trash"></i>

    </button>

</div>

  <!-- ==========================
     REPLY PREVIEW
========================== -->

<div
    id="replyPreview"
    class="reply-preview"
    style="display:none;"
>

    <div class="reply-preview-content">

        <div class="reply-preview-title">
            Replying to
            <strong id="replyUser"></strong>
        </div>

        <div
            id="replyPreviewText"
            class="reply-preview-text">
        </div>

    </div>

    <button
        id="cancelReply"
        type="button"
        class="cancel-reply">

        <i class="fa-solid fa-xmark"></i>

    </button>

</div>

<div class="message-bar">

<label
for="groupImage"
class="icon-btn">

<i class="fa-solid fa-image"></i>

</label>

<input
type="file"
id="groupImage"
accept="image/*"
hidden>

<textarea

id="message"

rows="1"

placeholder="Type a message...">

</textarea>

<button id="recordBtn" type="button">
    <i class="fa-solid fa-microphone"></i>
</button>

<button id="sendBtn">

<i class="fa-solid fa-paper-plane"></i>

</button>

</div>

  <!-- ==========================
     REACTION PICKER
========================== -->

<div id="reactionPicker" class="reaction-picker">

    <button data-emoji="👍">👍</button>
    <button data-emoji="❤️">❤️</button>
    <button data-emoji="😂">😂</button>
    <button data-emoji="😮">😮</button>
    <button data-emoji="😢">😢</button>
    <button data-emoji="😡">😡</button>

</div>

  <!-- ==========================
     MESSAGE ACTION MENU
========================== -->

<div id="messageActionMenu" class="message-action-menu">

    <div class="reaction-row">

        <button data-reaction="❤️">❤️</button>
        <button data-reaction="👍">👍</button>
        <button data-reaction="😂">😂</button>
        <button data-reaction="😮">😮</button>
        <button data-reaction="😢">😢</button>
        <button data-reaction="😡">😡</button>

    </div>

    <div class="action-row">

        <button id="replyAction">
            ↩️ Reply
        </button>

    </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script src="/js/group-chat.js"></script>

</body>

</html>
