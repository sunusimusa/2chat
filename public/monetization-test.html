<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>2Chat Monetization Test</title>

    <style>

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow:
                0 4px 15px
                rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #ff0874;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
        }

        #message {
            margin-top: 15px;
        }

        pre {
            margin-top: 15px;
            background: #111;
            color: #00ff88;
            padding: 15px;
            border-radius: 10px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

    </style>

</head>

<body>


<div class="container">

    <div class="card">

        <h1>
            💰 2Chat Monetization Test
        </h1>

        <p>
            Test Creator Monetization API
        </p>


        <button
            id="testBtn"
            onclick="testMonetization()">

            🔍 Check Monetization

        </button>


        <div id="message">
            Ready...
        </div>


        <pre
            id="result">No result yet.</pre>

    </div>

</div>


<script>

async function testMonetization() {

    const button =
        document.getElementById(
            "testBtn"
        );

    const message =
        document.getElementById(
            "message"
        );

    const result =
        document.getElementById(
            "result"
        );


    // =====================================
    // GET LOGIN TOKEN
    // =====================================

    const token =
        localStorage.getItem(
            "token"
        );


    if (!token) {

        message.innerText =
            "❌ No login token found. Please login first.";

        result.innerText =
            "localStorage.token is missing.";

        return;

    }


    button.disabled = true;

    button.innerText =
        "Checking...";


    message.innerText =
        "Connecting to Render API...";


    try {

        const response =
            await fetch(
                "/api/monetization/status",
                {

                    method: "GET",

                    headers: {

                        "Authorization":
                            "Bearer " + token,

                        "Content-Type":
                            "application/json"

                    }

                }
            );


        const data =
            await response.json();


        console.log(
            "MONETIZATION RESPONSE:",
            data
        );


        result.innerText =
            JSON.stringify(
                data,
                null,
                2
            );


        if (!response.ok) {

            message.innerText =
                "❌ API Error: " +
                (
                    data.message ||
                    "Request failed"
                );

            return;

        }


        if (!data.success) {

            message.innerText =
                "❌ " +
                (
                    data.message ||
                    "Monetization check failed"
                );

            return;

        }


        const monetization =
            data.monetization;


        if (
            monetization &&
            monetization.eligible
        ) {

            message.innerText =
                "✅ Creator is eligible for monetization.";

        } else {

            message.innerText =
                "ℹ️ Creator is not yet eligible.";

        }


    } catch (error) {

        console.error(
            "MONETIZATION TEST ERROR:",
            error
        );


        message.innerText =
            "❌ Connection error.";

        result.innerText =
            error.message;

    }


    button.disabled = false;

    button.innerText =
        "🔍 Check Monetization";

}

</script>


</body>

</html>
