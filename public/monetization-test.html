<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>2Chat Monetization</title>

    <style>

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            font-size: 18px;
            line-height: 1.4;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: #ff0874;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        button:disabled {
            opacity: .6;
        }

        #message {
            margin-top: 18px;
            font-size: 17px;
        }

        /* =========================
           ELIGIBILITY STATUS
        ========================= */

        .status-box {
            margin-top: 20px;
            padding: 22px;
            border-radius: 18px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            border: 3px solid;
        }

        .eligible {
            color: #168a45;
            background: #effff5;
            border-color: #35b96f;
        }

        .not-eligible {
            color: #c52c2c;
            background: #fff3f3;
            border-color: #ff6666;
        }

        /* =========================
           REQUIREMENTS
        ========================= */

        .section-title {
            margin-top: 30px;
            font-size: 25px;
        }

        .requirement {
            margin-top: 18px;
            padding: 18px;
            border: 2px solid #ddd;
            border-radius: 16px;
        }

        .requirement-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .met {
            color: #159447;
        }

        .not-met {
            color: #d93636;
        }

        .progress-bg {
            height: 14px;
            background: #e5e5e5;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 15px;
        }

        .progress {
            height: 100%;
            background: #ff0874;
            border-radius: 20px;
        }

        .numbers {
            margin-top: 12px;
            color: #555;
            font-size: 17px;
        }

        /* =========================
           STATS
        ========================= */

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 18px;
        }

        .stat {
            background: #fafafa;
            padding: 18px;
            border-radius: 16px;
        }

        .stat-label {
            color: #777;
            font-size: 16px;
        }

        .stat-value {
            margin-top: 8px;
            font-size: 24px;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="card">

        <h1>
            💰 2Chat Monetization
        </h1>

        <p class="subtitle">
            Check your creator monetization eligibility.
        </p>


        <button
            id="testBtn"
            onclick="testMonetization()">

            🔍 Check Monetization

        </button>

        <button
    id="eligibleBtn"
    onclick="makeMeEligible()"
    style="
        margin-top:10px;
        background:#111;
    "
>
    🧪 Make Me Eligible (TEST)
</button>

        <button
    id="applyBtn"
    onclick="applyForMonetization()"
    style="
        margin-top:10px;
        background:#168a45;
    "
>
    📩 Apply for Monetization
</button>


        <div id="message">
            Ready...
        </div>


        <!-- =========================
             ELIGIBILITY STATUS
        ========================= -->

        <div
            id="statusBox"
            class="status-box hidden">
        </div>


        <!-- =========================
             REQUIREMENTS
        ========================= -->

        <div id="requirementsSection"
             class="hidden">

            <h2 class="section-title">
                📋 Monetization Requirements
            </h2>

            <div id="requirements"></div>

        </div>


        <!-- =========================
             CREATOR STATS
        ========================= -->

        <div id="statsSection"
             class="hidden">

            <h2 class="section-title">
                📊 Creator Stats
            </h2>

            <div
                id="stats"
                class="stats-grid">
            </div>

        </div>

    </div>

</div>


<script>


async function testMonetization() {

    const button =
        document.getElementById("testBtn");

    const message =
        document.getElementById("message");

    const statusBox =
        document.getElementById("statusBox");

    const requirementsSection =
        document.getElementById(
            "requirementsSection"
        );

    const requirements =
        document.getElementById(
            "requirements"
        );

    const statsSection =
        document.getElementById(
            "statsSection"
        );

    const stats =
        document.getElementById("stats");


    // =====================================
    // GET LOGIN TOKEN
    // =====================================

    const token =
        localStorage.getItem("token");


    if (!token) {

        message.innerText =
            "❌ Please login first.";

        return;

    }


    button.disabled = true;

    button.innerText =
        "Checking...";


    message.innerText =
        "Checking your monetization status...";


    try {


        const response =
            await fetch(
                "/api/monetization/status",
                {

                    method: "GET",

                    headers: {

                        "Authorization":
                            "Bearer " + token,

                        "Content-Type":
                            "application/json"

                    }

                }
            );


        const data =
            await response.json();


        console.log(
            "Monetization status:",
            data
        );


        if (!response.ok) {

            message.innerText =
                "❌ " +
                (
                    data.message ||
                    "Request failed"
                );

            return;

        }


        if (!data.success) {

            message.innerText =
                "❌ " +
                (
                    data.message ||
                    "Unable to check monetization."
                );

            return;

        }


        const monetization =
            data.monetization;


        if (!monetization) {

            message.innerText =
                "❌ Monetization data unavailable.";

            return;

        }


        /*
        =====================================
        ELIGIBILITY STATUS
        =====================================
        */


        statusBox.classList.remove(
            "hidden",
            "eligible",
            "not-eligible"
        );


        if (monetization.status === "approved") {

    statusBox.classList.add(
        "eligible"
    );

    statusBox.innerHTML =
        "🟢 MONETIZATION APPROVED";

    message.innerText =
        "🎉 Congratulations! Your monetization application has been approved.";

}
else if (monetization.status === "pending") {

    statusBox.classList.add(
        "eligible"
    );

    statusBox.innerHTML =
        "🟡 APPLICATION PENDING";

    message.innerText =
        "⏳ Your monetization application is waiting for admin review.";

}
else if (monetization.status === "rejected") {

    statusBox.classList.add(
        "not-eligible"
    );

    statusBox.innerHTML =
        "🔴 APPLICATION REJECTED";

    message.innerText =
        "❌ Your monetization application was rejected.";

}
else if (monetization.status === "suspended") {

    statusBox.classList.add(
        "not-eligible"
    );

    statusBox.innerHTML =
        "🚫 MONETIZATION SUSPENDED";

    message.innerText =
        "⚠️ Your monetization access has been suspended.";

}
else if (monetization.eligible) {

    statusBox.classList.add(
        "eligible"
    );

    statusBox.innerHTML =
        "🟢 ELIGIBLE FOR MONETIZATION";

    message.innerText =
        "🎉 You have met all monetization requirements. You can apply.";

}
else {

    statusBox.classList.add(
        "not-eligible"
    );

    statusBox.innerHTML =
        "🔴 NOT YET ELIGIBLE";

    message.innerText =
        "ℹ️ Some monetization requirements are still missing.";

    }

        else {

            statusBox.classList.add(
                "not-eligible"
            );

            statusBox.innerHTML =
                "🔴 NOT YET ELIGIBLE";

            message.innerText =
                "ℹ️ Some monetization requirements are still missing.";

        }


        /*
        =====================================
        REQUIREMENTS
        =====================================
        */


        requirementsSection.classList.remove(
            "hidden"
        );


        requirements.innerHTML = "";


        const req =
            monetization.requirements;


        addRequirement(
            "📅",
            "Account Age (days)",
            req.accountAge
        );


        addRequirement(
            "👥",
            "Followers",
            req.followers
        );


        addRequirement(
            "👀",
            "Views",
            req.views
        );


        addRequirement(
            "⏱️",
            "Watch Time",
            req.watchTime
        );


        addRequirement(
            "💰",
            "Earnings",
            req.earnings,
            true
        );


        /*
        =====================================
        CREATOR STATS
        =====================================
        */


        if (monetization.stats) {

            statsSection.classList.remove(
                "hidden"
            );

            const s =
                monetization.stats;


            stats.innerHTML = `

                ${stat(
                    "Username",
                    s.username
                )}

                ${stat(
                    "Followers",
                    s.followers
                )}

                ${stat(
                    "Videos",
                    s.videos
                )}

                ${stat(
                    "Views",
                    s.views
                )}

                ${stat(
                    "Likes",
                    s.likes
                )}

                ${stat(
                    "Comments",
                    s.comments
                )}

                ${stat(
                    "Shares",
                    s.shares
                )}

                ${stat(
                    "Saves",
                    s.saves
                )}

                ${stat(
                    "Watch Time",
                    s.watchTime
                )}

                ${stat(
                    "Total Earned",
                    "₦" +
                    Number(
                        s.totalEarned || 0
                    ).toLocaleString()
                )}

                ${stat(
                    "Available Balance",
                    "₦" +
                    Number(
                        s.availableBalance || 0
                    ).toLocaleString()
                )}

                ${stat(
                    "Account Age",
                    s.accountAgeDays +
                    " days"
                )}

            `;

        }


    } catch (error) {

        console.error(
            "MONETIZATION ERROR:",
            error
        );


        message.innerText =
            "❌ Connection error.";

    }


    button.disabled = false;

    button.innerText =
        "🔍 Check Monetization";

}


/*
=========================================
REQUIREMENT CARD
=========================================
*/


function addRequirement(
    icon,
    title,
    data,
    money = false
) {

    if (!data) return;


    const required =
        Number(data.required || 0);

    const current =
        Number(data.current || 0);


    let percentage = 0;


    if (required > 0) {

        percentage =
            (current / required) * 100;

    }


    percentage =
        Math.min(
            percentage,
            100
        );


    const remaining =
        Math.max(
            required - current,
            0
        );


    const currentText =
        money
            ? "₦" +
              current.toLocaleString()
            : current.toLocaleString();


    const requiredText =
        money
            ? "₦" +
              required.toLocaleString()
            : required.toLocaleString();


    const remainingText =
        money
            ? "₦" +
              remaining.toLocaleString()
            : remaining.toLocaleString();


    const status =
        data.met
            ? `
                <span class="met">
                    ✅ Met
                </span>
              `
            : `
                <span class="not-met">
                    ❌ Not met
                </span>
              `;


    const needText =
        data.met
            ? ""
            : `
                <div class="numbers">
                    Need ${remainingText} more
                </div>
              `;


    requirements.innerHTML += `

        <div class="requirement">

            <div class="requirement-header">

                <span>
                    ${icon}
                    ${title}
                </span>

                ${status}

            </div>


            <div class="progress-bg">

                <div
                    class="progress"
                    style="
                        width:${percentage}%;
                    ">
                </div>

            </div>


            <div class="numbers">

                ${currentText}
                /
                ${requiredText}

            </div>

            ${needText}

        </div>

    `;

}


/*
=========================================
STAT CARD
=========================================
*/


function stat(
    label,
    value
) {

    return `

        <div class="stat">

            <div class="stat-label">
                ${label}
            </div>

            <div class="stat-value">
                ${value}
            </div>

        </div>

    `;

}

async function makeMeEligible() {

    const button =
        document.getElementById("eligibleBtn");

    const message =
        document.getElementById("message");


    // =====================================
    // GET LOGIN TOKEN
    // =====================================

    const token =
        localStorage.getItem("token");


    if (!token) {

        message.innerText =
            "❌ Please login first.";

        return;

    }


    button.disabled = true;

    button.innerText =
        "Making eligible...";

    message.innerText =
        "🧪 Updating test eligibility...";


    try {

        const response =
            await fetch(
                "/api/monetization/test-make-eligible",
                {

                    method: "POST",

                    headers: {

                        "Authorization":
                            "Bearer " + token,

                        "Content-Type":
                            "application/json"

                    }

                }
            );


        const data =
            await response.json();


        console.log(
            "TEST ELIGIBILITY RESPONSE:",
            data
        );


        // =====================================
        // API ERROR
        // =====================================

        if (!response.ok) {

            message.innerText =
                "❌ " +
                (
                    data.message ||
                    "Failed to make eligible"
                );

            return;

        }


        // =====================================
        // SUCCESS
        // =====================================

        if (
            data.success &&
            data.monetization &&
            data.monetization.eligible
        ) {

            message.innerText =
                "✅ TEST SUCCESS: Creator is now eligible.";

            // Automatically refresh status
            await testMonetization();

            return;

        }


        message.innerText =
            "⚠️ Request completed, but eligibility was not confirmed.";


    } catch (error) {

        console.error(
            "MAKE ELIGIBLE ERROR:",
            error
        );


        message.innerText =
            "❌ Test eligibility request failed.";

    } finally {

        button.disabled = false;

        button.innerText =
            "🧪 Make Me Eligible (TEST)";

    }

}


    async function applyForMonetization() {

    const button =
        document.getElementById("applyBtn");

    const message =
        document.getElementById("message");

    const token =
        localStorage.getItem("token");


    if (!token) {

        message.innerText =
            "❌ Please login first.";

        return;

    }


    button.disabled = true;

    button.innerText =
        "Submitting...";


    message.innerText =
        "📩 Submitting monetization application...";


    try {

        const response =
            await fetch(
                "/api/monetization/apply",
                {

                    method: "POST",

                    headers: {

                        "Authorization":
                            "Bearer " + token,

                        "Content-Type":
                            "application/json"

                    }

                }
            );


        const data =
            await response.json();


        console.log(
            "MONETIZATION APPLY:",
            data
        );


        if (!response.ok) {

            message.innerText =
                "❌ " +
                (
                    data.message ||
                    "Application failed."
                );

            return;

        }


        if (!data.success) {

            message.innerText =
                "❌ " +
                (
                    data.message ||
                    "Application failed."
                );

            return;

        }


        message.innerText =
            "✅ Application submitted successfully.";


        /*
        =====================================
        REFRESH MONETIZATION STATUS
        =====================================
        */

        await testMonetization();


    } catch (error) {

        console.error(
            "APPLY MONETIZATION ERROR:",
            error
        );


        message.innerText =
            "❌ Connection error.";

    }


    button.disabled = false;

    button.innerText =
        "📩 Apply for Monetization";

}


</script>


</body>

</html>
